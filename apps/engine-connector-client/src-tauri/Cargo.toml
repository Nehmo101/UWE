[package]
name = "uwe_engine_connector_client"
version = "0.1.0"
description = "UWE Command Center"
authors = ["UWE"]
edition = "2021"
build = "build.rs"

[lib]
name = "uwe_engine_connector_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dirs = "6.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", package = "serde", features = ["derive"] }
serde_json = "1.0.150"
# Muss zur Minor-Version von @tauri-apps/api in package.json passen — sonst
# bricht `tauri build` mit „Found version mismatched Tauri packages" ab.
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["rustls-tls"] }
url = "2.5.8"
