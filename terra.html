  { radius: 0.6, dbl: true, ao: 0, map: TEX.leafBlade, alphaTest: 0.4 });
definePool("baum2", geoBaum2(), { radius: 2.4 });
definePool("tempel", geoTempel(), { radius: 4.2, ao: 0.22 });
definePool("tholos", geoTholos(), { radius: 3.4, ao: 0.22 });
definePool("villa", geoVilla(), { radius: 3.2 });
definePool("bogen", geoBogen(), { radius: 3.0, ao: 0.22 });
definePool("zwergenhalle", geoZwergenhalle(), { radius: 3.0 });
definePool("schmiedeturm", geoSchmiedeturm(), { radius: 2.4 });
definePool("zwergentor", geoZwergentor(), { radius: 3.4 });
definePool("elfenturm", geoElfenturm(), { radius: 1.9, ao: 0.2 });
definePool("pavillon", geoPavillon(), { radius: 2.6, ao: 0.2 });
definePool("windmuehle", geoWindmuehle(), { radius: 2.8, ao: 0.22 });
definePool("scheune", geoScheune(), { radius: 2.8 });
definePool("kuppel", geoKuppel(), { radius: 2.6 });
definePool("arkade", geoArkade(), { radius: 2.9 });
definePool("weg", geoWeg(), { radius: 0, ao: 0 });
definePool("fels", geoFels(), { radius: 1.1 });
definePool("pfosten", geoPfosten(), { radius: 0.5 });
var POOL_NAMES = Object.keys(POOLS);

/* --- Instanzdaten je Element (12 Zahlen pro Instanz) -------------------- */
/*  x, y, z, pitch, yaw, roll, sx, sy, sz, tintR, tintG, tintB              */

var _schattenN = new THREE.Vector3();
function emit(el, pool, x, y, z, yaw, sx, sy, sz, tint, pitch, roll) {
  var a = el.inst[pool];
  if (!a) { a = el.inst[pool] = []; }
  if (el.total >= MAX_INST_PER_EL) return;
  el.total++;
  a.push(x, y, z, pitch || 0, yaw || 0, roll || 0, sx, sy, sz,
    tint ? tint[0] : 1, tint ? tint[1] : 1, tint ? tint[2] : 1);
  // Kontaktschatten nur für bodenständige Objekte mit nennenswerter Grundfläche
  var r = POOLS[pool] ? POOLS[pool].radius : 0;
  if (r < 0.6) return;
  var bh = heightAt(x, z);
  if (Math.abs(y - bh) > 2.2) return;                 // z. B. Häuser auf Plateaus
  schattenAn(el, x, bh, z, r * sx * 1.6);
}
/** Legt einen an die Hangneigung angepassten Schattenfleck ab. */
function schattenAn(el, x, bh, z, groesse) {
  normalAt(x, z, _schattenN);
  el.schatten.push(x, bh + 0.06, z, groesse,
    _schattenN.x, _schattenN.y, _schattenN.z);
}
/** Merkt sich Schornsteine, aus denen später Rauch steigt. */
function rauchAus(el, kind, x, y, z, sc) {
  if (el.rauch.length > 60) return;
  if (kind === "industrie") el.rauch.push(x - 1.3 * sc, y + 6.3 * sc, z + 0.6 * sc);
  else if (kind === "schmiedeturm") el.rauch.push(x + 1.0 * sc, y + 6.5 * sc, z + 0.3 * sc);
  else if (kind === "zwergenhalle") el.rauch.push(x, y + 4.2 * sc, z);
}

/** Leichte, deterministische Farbvariation (±amt, plus winziger Farbdreh). */
function tintOf(rng, amt) {
  if (amt === undefined) amt = 0.06;
  var d = (rng() * 2 - 1) * amt, w = (rng() * 2 - 1) * amt * 0.5;
  return [1 + d + w, 1 + d, 1 + d - w * 0.6];
}

var _io = new THREE.Object3D();
_io.rotation.order = "YXZ";
var _ic = new THREE.Color();
var instanceTotal = 0;

/** Schreibt die Instanzen der genannten Pools neu (einmal pro Frame bei Bedarf). */
function repack(names) {
  for (var p = 0; p < names.length; p++) {
    var name = names[p], pool = POOLS[name], total = 0, e;
    if (!pool) continue;
    for (e = 0; e < elements.length; e++) {
      var arr = elements[e].inst[name];
      if (arr) total += arr.length / 12;
    }
    if (total === 0) { if (pool.mesh) pool.mesh.count = 0; pool.count = 0; continue; }
    pool.ensure(total);
    var mesh = pool.mesh, k = 0;
    for (e = 0; e < elements.length; e++) {
      var a = elements[e].inst[name];
      if (!a) continue;
      for (var i = 0; i < a.length; i += 12) {
        _io.position.set(a[i], a[i + 1], a[i + 2]);
        _io.rotation.set(a[i + 3], a[i + 4], a[i + 5], "YXZ");
        _io.scale.set(a[i + 6], a[i + 7], a[i + 8]);
        _io.updateMatrix();
        mesh.setMatrixAt(k, _io.matrix);
        _ic.setRGB(a[i + 9], a[i + 10], a[i + 11]);
        mesh.setColorAt(k, _ic);
        k++;
      }
    }
    mesh.count = k;
    pool.count = k;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }
  instanceTotal = 0;
  for (var q = 0; q < POOL_NAMES.length; q++) instanceTotal += POOLS[POOL_NAMES[q]].count;
}

/* --- Kontaktschatten: eine InstancedMesh für die ganze Karte ---------- */
var schattenGeo = weiteHuelle(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2));
var schattenMat = new THREE.MeshBasicMaterial({
  map: TEX.shadowBlob, color: 0x2b2318, transparent: true,
  depthWrite: false, side: THREE.DoubleSide, opacity: 0.45
});
var schattenMesh = null, schattenCap = 0, schattenAnzahl = 0;
var _schObj = new THREE.Object3D(), _schQ = new THREE.Quaternion();
var _schUp = new THREE.Vector3(0, 1, 0), _schV = new THREE.Vector3();
function schattenEnsure(n) {
  if (n <= schattenCap) return;
  var cap = Math.max(512, schattenCap * 2, Math.ceil(n * 1.35));
  if (schattenMesh) { scene.remove(schattenMesh); schattenMesh.dispose(); }
  schattenMesh = new THREE.InstancedMesh(schattenGeo, schattenMat, cap);
  schattenMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  schattenMesh.renderOrder = 1;
  schattenMesh.count = 0;
  scene.add(schattenMesh);
  schattenCap = cap;
}
function packSchatten() {
  var total = 0, e;
  for (e = 0; e < elements.length; e++) total += elements[e].schatten.length / 7;
  schattenAnzahl = total;
  if (total === 0) { if (schattenMesh) schattenMesh.count = 0; return; }
  schattenEnsure(total);
  var k = 0;
  for (e = 0; e < elements.length; e++) {
    var sa = elements[e].schatten;
    for (var i = 0; i < sa.length; i += 7) {
      _schV.set(sa[i + 4], sa[i + 5], sa[i + 6]);
      _schQ.setFromUnitVectors(_schUp, _schV);
      _schObj.position.set(sa[i], sa[i + 1], sa[i + 2]);
      _schObj.quaternion.copy(_schQ);
      _schObj.scale.set(sa[i + 3], 1, sa[i + 3]);
      _schObj.updateMatrix();
      schattenMesh.setMatrixAt(k++, _schObj.matrix);
    }
  }
  schattenMesh.count = k;
  schattenMesh.instanceMatrix.needsUpdate = true;
}

var packAll = false, packSet = null;
/** names weglassen = alle Pools neu schreiben. */
function markDirty(names) {
  if (!names) { packAll = true; return; }
  if (!packSet) packSet = {};
  for (var i = 0; i < names.length; i++) packSet[names[i]] = 1;
}
function flushPack() {
  if (!packAll && !packSet) return;
  repack(packAll ? POOL_NAMES : Object.keys(packSet));
  packAll = false; packSet = null;
  rauchPunkte.length = 0;
  for (var e = 0; e < elements.length; e++) {
    var r = elements[e].rauch;
    for (var i = 0; i < r.length; i++) rauchPunkte.push(r[i]);
  }
  packSchatten();
}

/* ==========================================================================
   6 — Elementmodell: alles Gezeichnete bleibt Daten (Punkte + Parameter + Seed)
   ========================================================================== */

var elements = [];
var nextId = 1;

function mkElement(kind, variant, points, params, seed) {
  return {
    id: nextId++,
    kind: kind,             // pfad | flaeche | objekt | ranke
    variant: variant,
    points: points,         // [{x,z}]
    params: params,
    seed: seed,
    inst: {},               // Instanzdaten je Pool
    schatten: [],           // abgeleitete Kontaktschatten (nicht gespeichert)
    rauch: [],              // Schornsteinpositionen für den Rauch
    total: 0,
    group: null,            // eigene Meshes (Ranken, Flusswasser)
    streets: null           // Viertel: erzeugtes Wegenetz
  };
}
function groupOf(el) {
  if (!el.group) { el.group = new THREE.Group(); scene.add(el.group); }
  return el.group;
}
function clearElement(el) {
  el.inst = {};
  el.schatten.length = 0;
  el.rauch.length = 0;
  el.total = 0;
  if (el.group) {
    for (var i = el.group.children.length - 1; i >= 0; i--) {
      var c = el.group.children[i];
      if (c.geometry) c.geometry.dispose();
      el.group.remove(c);
    }
  }
}
function dropElement(el) {
  markDirty(Object.keys(el.inst));
  clearElement(el);
  if (el.group) { scene.remove(el.group); el.group = null; }
  var i = elements.indexOf(el);
  if (i >= 0) elements.splice(i, 1);
}

/* ==========================================================================
   7 — Platzierungsregeln: Wasser, Hang, Korridor, Kollision
   ========================================================================== */

function newOcc(cell) { return { cell: cell || 3.5, map: {} }; }
function occFree(occ, x, z, r) {
  var cx = Math.floor(x / occ.cell), cz = Math.floor(z / occ.cell);
  for (var a = -1; a <= 1; a++) {
    for (var b = -1; b <= 1; b++) {
      var arr = occ.map[(cx + a) + "|" + (cz + b)];
      if (!arr) continue;
      for (var k = 0; k < arr.length; k += 3) {
        var dx = arr[k] - x, dz = arr[k + 1] - z, rr2 = arr[k + 2] + r;
        if (dx * dx + dz * dz < rr2 * rr2) return false;
      }
    }
  }
  return true;
}
function occAdd(occ, x, z, r) {
  var key = Math.floor(x / occ.cell) + "|" + Math.floor(z / occ.cell);
  var arr = occ.map[key] || (occ.map[key] = []);
  arr.push(x, z, r);
}

/**
 * Prüft alle verbindlichen Regeln und liefert die Bodenhöhe zurück
 * (oder null, wenn hier nichts stehen darf).
 */
function tryPlace(occ, x, z, r, opts) {
  if (x < -HALF + 1 || x > HALF - 1 || z < -HALF + 1 || z > HALF - 1) return null;
  var h = heightAt(x, z);
  if (h < WATER + 0.35) return null;                       // nichts im Wasser
  if (slopeAt(x, z) < COS40) return null;                   // nichts an Steilhängen
  if (!(opts && opts.ignoreCorridor) && inCorridor(x, z)) return null;  // nichts auf Wegen
  if (occ && !occFree(occ, x, z, r)) return null;           // keine Überschneidung
  if (occ) occAdd(occ, x, z, r);
  return h;
}

/* --- Pfad-Abtastung ----------------------------------------------------- */
function pathCurve(points) {
  var v = [];
  for (var i = 0; i < points.length; i++) v.push(new THREE.Vector3(points[i].x, 0, points[i].z));
  if (v.length < 2) return null;
  return new THREE.CatmullRomCurve3(v, false, "catmullrom", 0.5);
}
/** Gleichmäßige Abtastung mit Tangenten; s = Bogenlänge. */
function pathSamples(points, step) {
  var curve = pathCurve(points);
  if (!curve) return [];
  var len = curve.getLength();
  if (!(len > 0.01)) return [];
  var n = Math.max(1, Math.ceil(len / step));
  var out = [];
  for (var i = 0; i <= n; i++) {
    var t = i / n;
    var p = curve.getPointAt(t), tg = curve.getTangentAt(t);
    var tl = Math.sqrt(tg.x * tg.x + tg.z * tg.z) || 1;
    out.push({ x: p.x, z: p.z, tx: tg.x / tl, tz: tg.z / tl, s: t * len });
  }
  out.len = len;
  return out;
}

/* ==========================================================================
   8 — Pfad-Werkzeug: Straße, Mauer, Fluss, Hecke
   ========================================================================== */

/**
 * Baustile. Jede Kultur ist eine gewichtete Auswahl aus den Objekt-Pools —
 * dieselbe Bebauungslogik erzeugt damit sehr verschiedene Siedlungen.
 */
var KULTUR = {
  dorf:      [["haus", 8], ["haus2", 6], ["scheune", 3], ["windmuehle", 1], ["turm", 1], ["busch", 2]],
  klassisch: [["villa", 6], ["arkade", 4], ["kuppel", 3], ["tholos", 1], ["tempel", 1],
              ["bogen", 1], ["saeule", 2], ["zypresse", 2]],
  zwergisch: [["zwergenhalle", 6], ["schmiedeturm", 4], ["zwergentor", 1], ["mauer", 2],
              ["turm", 2], ["fels", 2]],
  elfisch:   [["elfenturm", 5], ["pavillon", 5], ["haus2", 2], ["kuppel", 1], ["baum2", 3]],
  werk:      [["industrie", 5], ["schmiedeturm", 3], ["haus", 3], ["kran", 2], ["turm", 1]],
  ruine:     [["saeule", 5], ["bogen", 2], ["mauer", 3], ["fels", 2], ["busch", 2]],
  gemischt:  [["haus", 4], ["haus2", 3], ["villa", 3], ["arkade", 2], ["kuppel", 2],
              ["elfenturm", 2], ["pavillon", 2], ["zwergenhalle", 2], ["schmiedeturm", 1],
              ["scheune", 2], ["windmuehle", 1], ["turm", 1], ["tholos", 1]]
};
KULTUR.wohn = KULTUR.dorf;          // Rückwärtskompatibilität für alte Karten

var BELAG = { erde: [1.02, 0.98, 0.9], stein: [0.9, 0.92, 0.95], pflaster: [0.82, 0.84, 0.86] };

function genStrasse(el) {
  var p = el.params, rng = rngOf(el.seed);
  var w = p.breite, sm = pathSamples(el.points, 1.6);
  if (!sm.length) return;
  var belag = BELAG[p.belag] || BELAG.erde;
  var i, s;
  // Fahrbahn aus abgeflachten Quadern
  for (i = 0; i < sm.length; i++) {
    s = sm[i];
    var y = Math.max(heightAt(s.x, s.z), WATER + 0.15) + 0.09;
    var t = tintOf(rng, 0.05);
    emit(el, "weg", s.x, y, s.z, Math.atan2(s.tx, s.tz),
      w, 1, 2.3, [belag[0] * t[0], belag[1] * t[1], belag[2] * t[2]]);
  }
  if (!p.haeuser) return;
  // Bebauung beidseitig, zur Straße ausgerichtet
  var occ = newOcc(4);
  var half = w * 0.5;
  for (var side = -1; side <= 1; side += 2) {
    var next = rr(rng, 2, p.abstand);
    for (i = 0; i < sm.length; i++) {
      s = sm[i];
      if (s.s < next) continue;
      next = s.s + p.abstand * rr(rng, 0.7, 1.35);
      var nx = -s.tz, nz = s.tx;
      var off = half + 2.6 + rr(rng, 0, p.streuung);
      var x = s.x + nx * off * side + s.tx * rr(rng, -p.streuung, p.streuung);
      var z = s.z + nz * off * side + s.tz * rr(rng, -p.streuung, p.streuung);
      var kind = wpick(rng, KULTUR[p.stil] || KULTUR.dorf);
      var h = tryPlace(occ, x, z, POOLS[kind].radius, null);
      if (h === null) continue;
      var sc = rr(rng, 0.85, 1.2);
      emit(el, kind, x, h - 0.15, z, Math.atan2(s.tx, s.tz) + rr(rng, -0.14, 0.14),
        sc, sc * rr(rng, 0.9, 1.15), sc, tintOf(rng));
      rauchAus(el, kind, x, h, z, sc);
      if (rng() < 0.35) {
        var bx = x + nx * side * rr(rng, 2.2, 3.6), bz = z + nz * side * rr(rng, 2.2, 3.6);
        var bh = tryPlace(occ, bx, bz, 0.9, null);
        if (bh !== null) emit(el, "busch", bx, bh, bz, rng() * 6.28,
          rr(rng, 0.8, 1.3), rr(rng, 0.8, 1.3), rr(rng, 0.8, 1.3), tintOf(rng));
      }
    }
  }
}

function genMauer(el) {
  var p = el.params, rng = rngOf(el.seed);
  var sm = pathSamples(el.points, 2.0);
  if (!sm.length) return;
  var gates = [];
  if (p.torAbstand > 0) {
    for (var g = p.torAbstand; g < sm.len; g += p.torAbstand) gates.push(g);
  }
  var nextTurm = p.turmAbstand;
  for (var i = 0; i < sm.length; i++) {
    var s = sm[i];
    var y = Math.max(heightAt(s.x, s.z), WATER + 0.2);
    var yaw = Math.atan2(s.tx, s.tz);
    var atGate = false;
    for (var k = 0; k < gates.length; k++) if (Math.abs(s.s - gates[k]) < 3.4) atGate = true;
    if (!atGate) {
      var t = tintOf(rng, 0.05);
      emit(el, "mauer", s.x, y - 0.35, s.z, yaw, p.dicke, 2.6 * p.hoehe, 2.2, t);
    }
    if (s.s >= nextTurm) {
      nextTurm += p.turmAbstand;
      var th = heightAt(s.x, s.z);
      emit(el, "turm", s.x, th - 0.4, s.z, rng() * 6.28,
        p.dicke * 0.85, p.hoehe * 1.05, p.dicke * 0.85, tintOf(rng, 0.04));
    }
  }
  // Tortürme flankierend
  for (var q = 0; q < gates.length; q++) {
    for (var side = -1; side <= 1; side += 2) {
      var target = gates[q] + side * 3.8, best = null;
      for (var m = 0; m < sm.length; m++) if (!best || Math.abs(sm[m].s - target) < Math.abs(best.s - target)) best = sm[m];
      if (!best) continue;
      emit(el, "turm", best.x, heightAt(best.x, best.z) - 0.4, best.z, rng() * 6.28,
        p.dicke * 0.8, p.hoehe * 1.15, p.dicke * 0.8, tintOf(rng, 0.04));
    }
  }
}

function genFluss(el) {
  var p = el.params, rng = rngOf(el.seed);
  var sm = pathSamples(el.points, 2.2);
  if (sm.length < 2) return;
  // Höhenprofil der Sohle glätten, damit das Wasser nicht bergauf fließt
  var prof = [];
  for (var i = 0; i < sm.length; i++) prof.push(baseHeightAt(sm[i].x, sm[i].z));
  for (var pass = 0; pass < 8; pass++) {
    var cp = prof.slice();
    for (var k = 1; k < prof.length - 1; k++) prof[k] = (cp[k - 1] + cp[k] * 2 + cp[k + 1]) * 0.25;
  }
  var pos = [], col = [], idx = [];
  var wc = new THREE.Color(0x6fb5c4), tmp = new THREE.Color();
  var wSurf = [];
  for (i = 0; i < sm.length; i++) {
    var s = sm[i];
    var y = prof[i] - p.tiefe * 0.42;
    wSurf.push(y);
    var nx = -s.tz, nz = s.tx, hw = p.breite * 0.5;
    tmp.copy(wc).multiplyScalar(0.95 + hashi(i, el.seed, 3) * 0.1);
    pos.push(s.x + nx * hw, y, s.z + nz * hw);
    col.push(tmp.r, tmp.g, tmp.b);
    pos.push(s.x - nx * hw, y, s.z - nz * hw);
    col.push(tmp.r, tmp.g, tmp.b);
    if (i > 0) {
      var a = (i - 1) * 2, b = a + 1, c = i * 2, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(col), 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  var mesh = new THREE.Mesh(g, new THREE.MeshLambertMaterial({
    vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide
  }));
  mesh.renderOrder = 5;
  groupOf(el).add(mesh);
  // Schilf und Steine am Ufer
  var occ = newOcc(2.2);
  for (i = 0; i < sm.length; i += 2) {
    var ss = sm[i];
    for (var side = -1; side <= 1; side += 2) {
      if (rng() > 0.55) continue;
      var ox = -ss.tz * side, oz = ss.tx * side;
      var d = p.breite * 0.5 + rr(rng, 0.6, 3.2);
      var x = ss.x + ox * d, z = ss.z + oz * d;
      var h = tryPlace(occ, x, z, 0.5, { ignoreCorridor: true });
      if (h === null) continue;
      var what = rng() < 0.72 ? "gras" : "fels";
      var sc = rr(rng, 0.8, 1.6);
      emit(el, what, x, h, z, rng() * 6.28, sc, sc * rr(rng, 1, 1.6), sc, tintOf(rng));
    }
  }
}

function genHecke(el) {
  var p = el.params, rng = rngOf(el.seed);
  var step = p.stil === "zaun" ? 2.0 : 1.15;
  var sm = pathSamples(el.points, step);
  for (var i = 0; i < sm.length; i++) {
    var s = sm[i];
    var nx = -s.tz, nz = s.tx;
    var j = rr(rng, -0.3, 0.3);
    var x = s.x + nx * j, z = s.z + nz * j;
    var h = heightAt(x, z);
    if (h < WATER + 0.25 || slopeAt(x, z) < COS40) continue;
    var yaw = Math.atan2(s.tx, s.tz);
    if (p.stil === "zaun") {
      emit(el, "pfosten", x, h, z, yaw + Math.PI / 2, 1, rr(rng, 0.9, 1.1) * p.hoehe, 1, tintOf(rng));
    } else {
      var sc = rr(rng, 0.85, 1.3);
      emit(el, "busch", x, h, z, rng() * 6.28, sc * 1.1, sc * p.hoehe, sc * 0.95, tintOf(rng, 0.08));
    }
  }
}

/* ==========================================================================
   9 — Flächen-Werkzeug: Wald, Feld, Viertel, Wiese
   ========================================================================== */

function polyBBox(pts) {
  var b = { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity };
  for (var i = 0; i < pts.length; i++) {
    if (pts[i].x < b.x0) b.x0 = pts[i].x;
    if (pts[i].x > b.x1) b.x1 = pts[i].x;
    if (pts[i].z < b.z0) b.z0 = pts[i].z;
    if (pts[i].z > b.z1) b.z1 = pts[i].z;
  }
  return b;
}
function inPoly(pts, x, z) {
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var a = pts[i], b = pts[j];
    if (((a.z > z) !== (b.z > z)) && (x < (b.x - a.x) * (z - a.z) / (b.z - a.z) + a.x)) inside = !inside;
  }
  return inside;
}
function polyArea(pts) {
  var s = 0;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) s += (pts[j].x + pts[i].x) * (pts[j].z - pts[i].z);
  return Math.abs(s * 0.5);
}
function polyCenter(pts) {
  var x = 0, z = 0;
  for (var i = 0; i < pts.length; i++) { x += pts[i].x; z += pts[i].z; }
  return { x: x / pts.length, z: z / pts.length };
}
/** Abstand so vergrößern, dass die Instanzzahl beherrschbar bleibt. */
function safeSpacing(pts, wanted, maxCount) {
  var a = polyArea(pts);
  var need = Math.sqrt(a / Math.max(1, maxCount));
  return Math.max(wanted, need);
}

function genWald(el) {
  var p = el.params, pts = el.points;
  var klump = p.klumpen === undefined ? 0.55 : p.klumpen;
  var sp = safeSpacing(pts, 6.5 / p.dichte * (1 - 0.28 * klump), 14000);
  var schwelle = 0.26 + klump * 0.36;
  var bb = polyBBox(pts), occ = newOcc(4);
  var c0 = Math.floor(bb.x0 / sp), c1 = Math.ceil(bb.x1 / sp);
  var d0 = Math.floor(bb.z0 / sp), d1 = Math.ceil(bb.z1 / sp);
  for (var cz = d0; cz <= d1; cz++) {
    for (var cx = c0; cx <= c1; cx++) {
      var r1 = hashi(cx, cz, el.seed), r2 = hashi(cx, cz, el.seed + 1), r3 = hashi(cx, cz, el.seed + 2);
      var x = (cx + 0.5 + (r1 - 0.5) * 0.85) * sp;
      var z = (cz + 0.5 + (r2 - 0.5) * 0.85) * sp;
      if (!inPoly(pts, x, z)) continue;
      // Bäume wachsen in Nestern mit Lichtungen dazwischen, nicht im Raster
      if (fractal(x * 0.04, z * 0.04, el.seed + 21) < schwelle) continue;
      var rng = rngOf((hashi(cx, cz, el.seed + 7) * 4294967296) | 0);
      var nadel = r3 < p.mischung;
      var kind = nadel ? "zypresse" : (hashi(cx, cz, el.seed + 33) < 0.42 ? "baum2" : "baum");
      var h = tryPlace(occ, x, z, POOLS[kind].radius * 0.8, null);
      if (h === null) continue;
      var sc = rr(rng, 0.8, 1.2);
      emit(el, kind, x, h - 0.1, z, rng() * 6.28, sc, sc * rr(rng, 0.85, 1.25), sc, tintOf(rng, 0.08));
      if (rng() < p.unterholz) {
        var bx = x + rr(rng, -sp * 0.5, sp * 0.5), bz = z + rr(rng, -sp * 0.5, sp * 0.5);
        if (!inPoly(pts, bx, bz)) continue;
        var bh = tryPlace(occ, bx, bz, 0.7, null);
        if (bh === null) continue;
        var bs = rr(rng, 0.7, 1.35);
        emit(el, rng() < 0.75 ? "busch" : "fels", bx, bh, bz, rng() * 6.28, bs, bs, bs, tintOf(rng, 0.08));
      }
    }
  }
}

var FRUCHT = {
  weizen: [1.05, 1.0, 0.82], kohl: [0.86, 0.99, 0.83],
  lavendel: [0.95, 0.92, 1.08], brache: [1.0, 0.96, 0.9]
};
function genFeld(el) {
  var p = el.params, pts = el.points, rng = rngOf(el.seed);
  var bb = polyBBox(pts), ctr = polyCenter(pts);
  var ext = Math.max(bb.x1 - bb.x0, bb.z1 - bb.z0) * 0.75 + 4;
  var a = p.drehung * DEG, dx = Math.cos(a), dz = Math.sin(a);
  var px = -dz, pz = dx;
  var rowSp = safeSpacing(pts, p.reihe, 6000) * 1.0;
  var alongSp = 2.6;
  var frucht = FRUCHT[p.frucht] || FRUCHT.weizen;
  var occ = newOcc(2);
  var nRows = Math.ceil(ext * 2 / rowSp);
  for (var r = -nRows; r <= nRows; r++) {
    var off = r * rowSp;
    var steps = Math.ceil(ext * 2 / alongSp);
    for (var s = 0; s <= steps; s++) {
      var t = -ext + s * alongSp;
      var x = ctr.x + dx * t + px * off, z = ctr.z + dz * t + pz * off;
      if (!inPoly(pts, x, z)) continue;
      var h = tryPlace(occ, x, z, 0.5, null);
      if (h === null) continue;
      var tn = tintOf(rng, 0.05);
      emit(el, "feldreihe", x, h, z, a + Math.PI / 2,
        rowSp * 0.34, rr(rng, 0.75, 1.15) * p.hoehe, alongSp * 0.55,
        [frucht[0] * tn[0], frucht[1] * tn[1], frucht[2] * tn[2]]);
    }
  }
}

function genWiese(el) {
  var p = el.params, pts = el.points;
  var sp = safeSpacing(pts, 2.6 / p.dichte, 20000);
  var bb = polyBBox(pts), occ = newOcc(1.5);
  var c0 = Math.floor(bb.x0 / sp), c1 = Math.ceil(bb.x1 / sp);
  var d0 = Math.floor(bb.z0 / sp), d1 = Math.ceil(bb.z1 / sp);
  for (var cz = d0; cz <= d1; cz++) {
    for (var cx = c0; cx <= c1; cx++) {
      var r1 = hashi(cx, cz, el.seed), r2 = hashi(cx, cz, el.seed + 1);
      var x = (cx + 0.5 + (r1 - 0.5) * 0.95) * sp, z = (cz + 0.5 + (r2 - 0.5) * 0.95) * sp;
      if (!inPoly(pts, x, z)) continue;
      var rng = rngOf((hashi(cx, cz, el.seed + 3) * 4294967296) | 0);
      var h = tryPlace(occ, x, z, 0.25, null);
      if (h === null) continue;
      var kind = rng() < p.blumen
        ? wpick(rng, [["blume", 4], ["blume2", 3], ["blume3", 2]]) : "gras";
      var sc = rr(rng, 0.75, 1.35);
      emit(el, kind, x, h, z, rng() * 6.28, sc, sc * rr(rng, 0.8, 1.3), sc, tintOf(rng, 0.1));
    }
  }
}

/** Inneres Wegenetz eines Viertels — reine Funktion der Punkte/Parameter/Seed. */
function districtStreets(el) {
  var p = el.params, pts = el.points, rng = rngOf(el.seed + 51);
  var bb = polyBBox(pts), ctr = polyCenter(pts);
  var ext = Math.max(bb.x1 - bb.x0, bb.z1 - bb.z0) * 0.72 + 3;
  var bs = Math.max(9, p.block);
  var out = [], k, s, line, steps, t;
  var ang = p.drehung * DEG;
  if (p.netz === "raster" || p.netz === "gebogen") {
    for (var dir = 0; dir < 2; dir++) {
      var a = ang + dir * Math.PI / 2, dx = Math.cos(a), dz = Math.sin(a);
      var px = -dz, pz = dx;
      var n = Math.ceil(ext / bs);
      for (k = -n; k <= n; k++) {
        var off = k * bs;
        line = []; steps = Math.max(8, Math.ceil(ext * 2 / 1.8));
        for (s = 0; s <= steps; s++) {
          t = -ext + (s / steps) * ext * 2;
          var wx = ctr.x + dx * t + px * off, wz = ctr.z + dz * t + pz * off;
          if (p.netz === "gebogen") {
            var b = (fractal(wx * 0.014, wz * 0.014, el.seed + dir * 31) - 0.5) * bs * 0.85;
            wx += px * b; wz += pz * b;
          }
          line.push({ x: wx, z: wz });
        }
        out.push(line);
      }
    }
  } else if (p.netz === "ring") {
    var R = ext, rings = clamp(Math.round(R / bs), 1, 7);
    for (var r = 1; r <= rings; r++) {
      var rad = (r / rings) * R * 0.92;
      line = []; steps = Math.max(24, Math.round(rad * 1.6));
      for (s = 0; s <= steps; s++) {
        var aa = (s / steps) * Math.PI * 2;
        line.push({ x: ctr.x + Math.cos(aa) * rad, z: ctr.z + Math.sin(aa) * rad });
      }
      out.push(line);
    }
    var spokes = ri(rng, 5, 9);
    for (k = 0; k < spokes; k++) {
      var sa = ang + k / spokes * Math.PI * 2;
      line = [];
      for (s = 0; s <= 40; s++) {
        t = (s / 40) * R * 0.95;
        line.push({ x: ctr.x + Math.cos(sa) * t, z: ctr.z + Math.sin(sa) * t });
      }
      out.push(line);
    }
  } else {   // zellen — unregelmäßige Blöcke durch verschobene Sehnen
    var K = clamp(Math.round(ext * 2 / bs) + 2, 3, 14);
    for (k = 0; k < K; k++) {
      var ca = rng() * Math.PI, cdx = Math.cos(ca), cdz = Math.sin(ca);
      var cpx = -cdz, cpz = cdx, coff = (rng() * 2 - 1) * ext * 0.85;
      line = [];
      for (s = 0; s <= 60; s++) {
        t = -ext + (s / 60) * ext * 2;
        var bx = ctr.x + cdx * t, bz = ctr.z + cdz * t;
        var bend = (fractal(bx * 0.02, bz * 0.02, el.seed + k * 17) - 0.5) * bs * 0.7;
        line.push({ x: bx + cpx * (coff + bend), z: bz + cpz * (coff + bend) });
      }
      out.push(line);
    }
  }
  return out;
}

function genViertel(el) {
  var p = el.params, pts = el.points, rng = rngOf(el.seed);
  if (!el.streets) el.streets = districtStreets(el);
  var streets = el.streets;
  var occ = newOcc(4.5);
  var i, k, s;
  // Gassen pflastern und als Sperrfläche vormerken
  for (i = 0; i < streets.length; i++) {
    var line = streets[i];
    for (k = 0; k < line.length; k++) {
      var q = line[k];
      if (!inPoly(pts, q.x, q.z)) continue;
      occAdd(occ, q.x, q.z, p.gasse * 0.5 + 0.6);
      var h = heightAt(q.x, q.z);
      if (h < WATER + 0.2 || slopeAt(q.x, q.z) < COS40) continue;
      var nx2 = k < line.length - 1 ? line[k + 1] : line[k - 1];
      var yaw = Math.atan2(nx2.x - q.x, nx2.z - q.z);
      var tn = tintOf(rng, 0.05);
      emit(el, "weg", q.x, h + 0.09, q.z, yaw, p.gasse, 1, 3.2,
        [0.84 * tn[0], 0.85 * tn[1], 0.88 * tn[2]]);
    }
  }
  // Bebauung an den Gassenseiten: geschlossene Reihen statt Streusiedlung.
  // In den Vorlagen stehen die Häuser Wand an Wand und bilden Blöcke.
  var table = KULTUR[p.stil] || KULTUR.dorf;
  var luecke = clamp(1.6 / p.dichte - 0.5, 0.1, 6);   // Abstand zwischen Nachbarn
  for (i = 0; i < streets.length; i++) {
    var ln = streets[i];
    for (var side = -1; side <= 1; side += 2) {
      var acc = rr(rng, 0, 6);
      var lauf = 0, laufKind = wpick(rng, table);
      for (k = 1; k < ln.length; k++) {
        var a = ln[k - 1], b = ln[k];
        var dx = b.x - a.x, dz = b.z - a.z, d = Math.sqrt(dx * dx + dz * dz);
        if (d < 0.001) continue;
        dx /= d; dz /= d;
        acc -= d;
        if (acc > 0) continue;
        // Reihenhaus-Läufe: 2–4 gleiche Typen nebeneinander, dann wechseln
        if (lauf <= 0) { laufKind = wpick(rng, table); lauf = ri(rng, 2, 4); }
        lauf--;
        var kind = laufKind;
        var br = POOLS[kind].radius * 2;
        acc = br + luecke * rr(rng, 0.4, 1.6);
        if (rng() < 0.1) continue;                     // gelegentliche Baulücke
        var off = p.gasse * 0.5 + POOLS[kind].radius + rr(rng, 0.2, 1.1);
        var x = b.x + (-dz) * off * side, z = b.z + dx * off * side;
        if (!inPoly(pts, x, z)) continue;
        var hh = tryPlace(occ, x, z, POOLS[kind].radius * 0.82, { ignoreCorridor: true });
        if (hh === null) continue;
        var sc = rr(rng, 0.88, 1.14);
        emit(el, kind, x, hh - 0.15, z, Math.atan2(dx, dz) + rr(rng, -0.05, 0.05),
          sc, sc * rr(rng, 0.9, 1.25), sc, tintOf(rng));
        rauchAus(el, kind, x, hh, z, sc);
      }
    }
  }
}

function genFlaeche(el) {
  if (el.points.length < 3) return;
  if (el.variant === "wald") genWald(el);
  else if (el.variant === "feld") genFeld(el);
  else if (el.variant === "viertel") genViertel(el);
  else if (el.variant === "wiese") genWiese(el);
}

/* ==========================================================================
   10 — Objekt-Werkzeug
   ========================================================================== */

var OBJGRUPPEN = {
  baeume: [["baum", 5], ["baum2", 4], ["zypresse", 2], ["busch", 3]],
  haeuser: [["haus", 5], ["haus2", 4], ["turm", 2], ["kuppel", 2], ["arkade", 1],
            ["scheune", 2], ["windmuehle", 1]],
  klassisch: [["villa", 3], ["tholos", 2], ["tempel", 1], ["bogen", 2], ["saeule", 4], ["arkade", 2]],
  zwergisch: [["zwergenhalle", 3], ["schmiedeturm", 3], ["zwergentor", 2], ["mauer", 2]],
  elfisch: [["elfenturm", 3], ["pavillon", 3], ["baum2", 2]],
  ruinen: [["saeule", 5], ["mauer", 3], ["fels", 2]],
  felsen: [["fels", 7], ["busch", 2]],
  werk: [["industrie", 3], ["kran", 2], ["haus", 2]],
  natur: [["busch", 4], ["blume", 5], ["gras", 6], ["fels", 1]]
};
function genObjekt(el) {
  var p = el.params, occ = newOcc(3.5);
  var table = OBJGRUPPEN[el.variant] || OBJGRUPPEN.baeume;
  for (var i = 0; i < el.points.length; i++) {
    var pt = el.points[i];
    var rng = rngOf((el.seed + i * 7919) | 0);
    var n = Math.max(1, p.anzahl);
    for (var k = 0; k < n; k++) {
      var ang = rng() * 6.28, rad = k === 0 ? 0 : Math.sqrt(rng()) * p.streuung;
      var x = pt.x + Math.cos(ang) * rad, z = pt.z + Math.sin(ang) * rad;
      var kind = (p.nurTyp && POOLS[p.nurTyp]) ? p.nurTyp : wpick(rng, table);
      var h = tryPlace(occ, x, z, POOLS[kind].radius * 0.85, { ignoreCorridor: p.frei });
      if (h === null) continue;
      var sc = rr(rng, 0.8, 1.2) * p.groesse;
      emit(el, kind, x, h - 0.1, z, rng() * 6.28, sc, sc * rr(rng, 0.88, 1.2), sc, tintOf(rng));
    }
  }
}

/* ==========================================================================
   11 — Die weißen Ranken: Kernmotiv der Welt
   ========================================================================== */

// Die Ranke ist in allen Vorlagen der hellste Wert im Bild — auch im Schatten
// und im Nebel. Das schafft nur eine eigene Grundhelligkeit.
var vineMat = terraMat({
  color: 0xffffff, vertexColors: true, transparent: true, opacity: 0.95,
  emissive: 0x4a463e
});
var leafMat = terraMat({ vertexColors: true, side: THREE.DoubleSide });
var rockMat = terraMat({ vertexColors: true });
tintedMats.push(vineMat, leafMat, rockMat);

var VINE_LO = new THREE.Color(0xe7e2d6), VINE_MID = new THREE.Color(0xf4f1e8),
    VINE_HI = new THREE.Color(0xffffff);

/** Farbverlauf einer Ranke: unten leicht abgetönt, oben rein weiß im Dunst. */
function vineColor(t, out) {
  if (t < 0.25) out.copy(VINE_LO).lerp(VINE_MID, t / 0.25);
  else out.copy(VINE_MID).lerp(VINE_HI, sstep(0.25, 1, t));
}

var _vUp = new THREE.Vector3(0, 0, 1);
function frameAt(curve, t, outC, outN1, outN2) {
  curve.getPoint(t, outC);
  var tan = curve.getTangent(t).normalize();
  outN1.crossVectors(tan, _vUp);
  if (outN1.lengthSq() < 1e-6) outN1.set(1, 0, 0);
  outN1.normalize();
  outN2.crossVectors(tan, outN1).normalize();
}

function genRanke(el) {
  var p = el.params, rng = rngOf(el.seed);
  var pt = el.points[0];
  if (!pt) return;
  var x0 = pt.x, z0 = pt.z;
  var y0 = heightAt(x0, z0) - 1.8;
  var H = p.hoehe;
  var geos = [], i, k, t;

  // --- Mittelachse mit sanfter seitlicher Auslenkung ---
  var ctrl = [], NC = 12;
  var sway = H * 0.06;
  for (i = 0; i <= NC; i++) {
    t = i / NC;
    var f = Math.pow(t, 0.85);
    ctrl.push(new THREE.Vector3(
      x0 + (fractal(t * 3.1 + 1.7, 0.5, el.seed + 3) - 0.5) * 2 * sway * f,
      y0 + t * H,
      z0 + (fractal(0.5, t * 3.1 + 4.2, el.seed + 9) - 0.5) * 2 * sway * f
    ));
  }
  var axis = new THREE.CatmullRomCurve3(ctrl, false, "catmullrom", 0.5);

  // --- Stränge: viele, dünn und eng gewickelt, damit ein Geflecht entsteht
  var nStr = clamp(Math.round(p.straenge), 4, 10);
  // Die Steigung wird in Ranken-Durchmessern je Umdrehung angegeben — nur so
  // bleibt das Geflecht bei jeder Höhe gleich dicht geflochten.
  var TURNS = H / (p.steigung * 2 * VINE_R);
  var RINGS = clamp(Math.round(TURNS * 22), 64, 220);
  var c = new THREE.Vector3(), n1 = new THREE.Vector3(), n2 = new THREE.Vector3();
  function wrapAt(tt) { return VINE_R * 0.66 * (1 - 0.58 * tt); }
  function strandR(tt) { return VINE_R * (0.06 + 0.21 * Math.pow(1 - tt, 1.15)); }
  for (k = 0; k < nStr; k++) {
    var a0 = k / nStr * Math.PI * 2 + rr(rng, -0.06, 0.06);
    var pts = [];
    for (i = 0; i <= RINGS; i++) {
      t = i / RINGS;
      frameAt(axis, t, c, n1, n2);
      var wrap = wrapAt(t);
      var ang = a0 + t * TURNS * Math.PI * 2;
      var ca = Math.cos(ang), sa = Math.sin(ang);
      pts.push(new THREE.Vector3(
        c.x + n1.x * ca * wrap + n2.x * sa * wrap,
        c.y,
        c.z + n1.z * ca * wrap + n2.z * sa * wrap
      ));
    }
    var thick = rr(rng, 0.85, 1.15);
    geos.push(tubeGeo(pts, function (tt) { return strandR(tt) * thick; },
      7, function (tt, ii, col) { vineColor(tt, col); }));
  }

  // --- Wurzelteller: viele, unterschiedlich weit ausgreifende Bögen ---
  var nRoot = ri(rng, 12, 16);
  for (k = 0; k < nRoot; k++) {
    var ra = (k / nRoot) * Math.PI * 2 + rr(rng, -0.16, 0.16);
    var rd = VINE_R * rr(rng, 1.7, 3.6);
    var gx = x0 + Math.cos(ra) * rd, gz = z0 + Math.sin(ra) * rd;
    var gy = heightAt(gx, gz) - 2.4;
    var attach = VINE_R * rr(rng, 0.9, 2.8);
    var bulk = rr(rng, 0.75, 1.45);
    var rp = [];
    for (i = 0; i <= 16; i++) {
      t = i / 16;
      var e = t * t * (3 - 2 * t);
      var swirl = Math.sin(t * Math.PI) * rr(rng, -0.35, 0.35);
      rp.push(new THREE.Vector3(
        lerp(gx, x0 + Math.cos(ra) * VINE_R * 0.42, e) - Math.sin(ra) * swirl * VINE_R,
        lerp(gy, y0 + attach, e) + Math.sin(t * Math.PI) * VINE_R * 0.26,
        lerp(gz, z0 + Math.sin(ra) * VINE_R * 0.42, e) + Math.cos(ra) * swirl * VINE_R
      ));
    }
    geos.push(tubeGeo(rp, function (tt) {
      return VINE_R * (0.055 + 0.21 * Math.pow(tt, 0.75)) * bulk;
    }, 7, function (tt, ii, col) { vineColor(tt * 0.1, col); }));
  }

  schattenAn(el, x0, heightAt(x0, z0), z0, VINE_R * 5.2);

  var vineMesh = new THREE.Mesh(mergeGeos(geos), vineMat);
  vineMesh.userData.el = el;
  vineMesh.renderOrder = 2;
  groupOf(el).add(vineMesh);

  // --- Erdhügel, über den die Wurzeln laufen ---
  var mound = new THREE.Mesh(
    moundGeo(VINE_R * 3.6, VINE_R * 0.75, x0, z0, (el.seed + 61) | 0), rockMat);
  mound.position.set(x0, heightAt(x0, z0), z0);
  mound.userData.el = el;
  groupOf(el).add(mound);

  // --- Blätter am Stamm ---
  var nLeaf = Math.round(p.blaetter);
  for (k = 0; k < nLeaf; k++) {
    t = clamp(0.06 + Math.pow(rng(), 0.85) * 0.92, 0, 0.99);
    frameAt(axis, t, c, n1, n2);
    var la = rng() * Math.PI * 2;
    var surf = wrapAt(t) + strandR(t) * 0.7;
    var lx = c.x + n1.x * Math.cos(la) * surf + n2.x * Math.sin(la) * surf;
    var lz = c.z + n1.z * Math.cos(la) * surf + n2.z * Math.sin(la) * surf;
    var dirA = Math.atan2(lz - c.z, lx - c.x);
    var size = VINE_R * rr(rng, 0.9, 1.9) * (1 - t * 0.35);
    emit(el, "blatt", lx, c.y, lz, -dirA + rr(rng, -0.3, 0.3),
      size, size, size, tintOf(rng, 0.1), 0, rr(rng, -0.85, -0.15));
  }

  // --- Blattplateaus, spiralig um den Stamm gestaffelt ---
  var nPl = clamp(Math.round(p.plateaus), 0, 6);
  var leafGeos = [];
  var _lv = new THREE.Vector3();
  for (k = 0; k < nPl; k++) {
    var fr = nPl > 1 ? k / (nPl - 1) : 0.45;
    t = clamp(0.34 + fr * 0.54 + rr(rng, -0.025, 0.025), 0.1, 0.96);
    frameAt(axis, t, c, n1, n2);
    var pang = k * 2.39996 + el.seed * 0.0007;
    var L = lerp(44, 24, fr) * p.plateau;
    var W = L * 0.66, cup = 0.17, thick = L * 0.04;
    var ox = Math.cos(pang), oz = Math.sin(pang);
    var g = leafGeo(L, W, cup, thick, 0x62894a, 0x9cba7a, 0x8fb06c, (el.seed + k * 31) | 0);
    var droop = M(0, 0, 0, 0, 0, -0.1);
    var place = M(c.x + ox * VINE_R * 0.45, c.y, c.z + oz * VINE_R * 0.45, 0, -pang, 0);
    var full = new THREE.Matrix4().multiplyMatrices(place, droop);
    g.applyMatrix4(full);
    leafGeos.push(g);

    if (!p.staedtchen) continue;
    var occ2 = newOcc(4);
    var nH = ri(rng, 5, 18);
    for (i = 0; i < nH; i++) {
      var u = rr(rng, 0.22, 0.86), v = rr(rng, -0.72, 0.72);
      _lv.set(u * L, leafSurface(u, v, L, cup), v * leafHalfWidth(u) * W).applyMatrix4(full);
      if (!occFree(occ2, _lv.x, _lv.z, 2.5)) continue;
      occAdd(occ2, _lv.x, _lv.z, 2.5);
      var kind = wpick(rng, [["haus", 6], ["haus2", 4], ["turm", 2], ["kuppel", 2], ["arkade", 1]]);
      var sc = rr(rng, 0.65, 0.95);
      emit(el, kind, _lv.x, _lv.y - 0.1, _lv.z, -pang + rr(rng, -0.25, 0.25),
        sc, sc * rr(rng, 0.9, 1.25), sc, tintOf(rng));
    }
    var nCyp = ri(rng, 4, 9);
    for (i = 0; i < nCyp; i++) {
      var u2 = rr(rng, 0.3, 0.92), v2 = (rng() < 0.5 ? -1 : 1) * rr(rng, 0.78, 0.92);
      _lv.set(u2 * L, leafSurface(u2, v2, L, cup), v2 * leafHalfWidth(u2) * W).applyMatrix4(full);
      var sc2 = rr(rng, 0.45, 0.8);
      emit(el, "zypresse", _lv.x, _lv.y - 0.1, _lv.z, rng() * 6.28,
        sc2, sc2 * rr(rng, 0.9, 1.3), sc2, tintOf(rng, 0.08));
    }
  }
  if (leafGeos.length) {
    var lm = new THREE.Mesh(mergeGeos(leafGeos), leafMat);
    lm.userData.el = el;
    groupOf(el).add(lm);
  }

  // --- Schwebeinseln ---
  var nIsl = clamp(Math.round(p.inseln), 0, 4);
  var islGeos = [];
  for (k = 0; k < nIsl; k++) {
    t = rr(rng, 0.25, 0.95);
    frameAt(axis, t, c, n1, n2);
    var ia = rr(rng, 0, 6.283), idst = VINE_R * rr(rng, 2.6, 7);
    var ix = c.x + Math.cos(ia) * idst, iy = c.y + rr(rng, -H * 0.05, H * 0.05),
        iz = c.z + Math.sin(ia) * idst;
    var ir = rr(rng, 3.5, 8);
    var ig = islandGeo(ir, (el.seed + k * 77) | 0);
    ig.applyMatrix4(M(ix, iy, iz, 0, rr(rng, 0, 6.283), 0));
    islGeos.push(ig);
    var nT = ri(rng, 0, 3);
    for (i = 0; i < nT; i++) {
      var ta = rng() * 6.283, tq = Math.sqrt(rng()) * ir * 0.5;
      var sc3 = rr(rng, 0.3, 0.6);
      emit(el, rng() < 0.6 ? "baum" : "zypresse",
        ix + Math.cos(ta) * tq, iy + ir * 0.28, iz + Math.sin(ta) * tq,
        rng() * 6.28, sc3, sc3, sc3, tintOf(rng, 0.08));
    }
  }
  if (islGeos.length) {
    var im = new THREE.Mesh(mergeGeos(islGeos), rockMat);
    im.userData.el = el;
    groupOf(el).add(im);
  }
}

/* ==========================================================================
   12 — Generierung, Korridore, Flüsse, Gesamt-Neuaufbau
   ========================================================================== */

function genElement(el) {
  clearElement(el);
  // Fehlende Parameter aus dem Schema ergänzen — hält geladene Karten robust
  var def = defaultsFor(el.kind, el.variant);
  for (var dk in def) if (el.params[dk] === undefined) el.params[dk] = def[dk];
  if (el.kind === "pfad") {
    if (el.points.length < 2) return;
    if (el.variant === "strasse") genStrasse(el);
    else if (el.variant === "mauer") genMauer(el);
    else if (el.variant === "fluss") genFluss(el);
    else if (el.variant === "hecke") genHecke(el);
  } else if (el.kind === "flaeche") genFlaeche(el);
  else if (el.kind === "objekt") genObjekt(el);
  else if (el.kind === "ranke") genRanke(el);
}

/** Erzeugt ein Element neu und merkt sich nur die betroffenen Pools. */
function regenElement(el) {
  var names = Object.keys(el.inst);
  genElement(el);
  var after = Object.keys(el.inst);
  for (var i = 0; i < after.length; i++) names.push(after[i]);
  markDirty(names);
}

/** Sammelt alle Flussverläufe (Basis für das Einschneiden des Terrains). */
function rebuildRivers() {
  rivers.length = 0;
  for (var i = 0; i < elements.length; i++) {
    var el = elements[i];
    if (el.kind !== "pfad" || el.variant !== "fluss" || el.points.length < 2) continue;
    var sm = pathSamples(el.points, 1.6);
    if (!sm.length) continue;
    var prof = [];
    for (var k = 0; k < sm.length; k++) prof.push(baseHeightAt(sm[k].x, sm[k].z));
    for (var pass = 0; pass < 8; pass++) {
      var cp = prof.slice();
      for (var m = 1; m < prof.length - 1; m++) prof[m] = (cp[m - 1] + cp[m] * 2 + cp[m + 1]) * 0.25;
    }
    var samples = [];
    for (var s = 0; s < sm.length; s++) samples.push({ x: sm[s].x, z: sm[s].z, y: prof[s] });
    rivers.push({ samples: samples, radius: el.params.breite * 0.62 + 2.2, depth: el.params.tiefe });
  }
}

/** Baut die Sperrmaske für Straßen, Flüsse, Mauern und Viertel-Gassen neu auf. */
function rebuildCorridors() {
  corridor.fill(0);
  for (var i = 0; i < elements.length; i++) {
    var el = elements[i], k, sm;
    if (el.kind === "pfad" && el.points.length >= 2) {
      if (el.variant === "strasse") {
        sm = pathSamples(el.points, 1.4);
        for (k = 0; k < sm.length; k++) stampCorridor(sm[k].x, sm[k].z, el.params.breite * 0.5 + 1.6);
      } else if (el.variant === "fluss") {
        sm = pathSamples(el.points, 1.4);
        for (k = 0; k < sm.length; k++) stampCorridor(sm[k].x, sm[k].z, el.params.breite * 0.6 + 2.2);
      } else if (el.variant === "mauer") {
        sm = pathSamples(el.points, 1.6);
        for (k = 0; k < sm.length; k++) stampCorridor(sm[k].x, sm[k].z, el.params.dicke * 0.6 + 1.2);
      }
    } else if (el.kind === "flaeche" && el.variant === "viertel" && el.points.length >= 3) {
      el.streets = districtStreets(el);
      for (var s = 0; s < el.streets.length; s++) {
        var ln = el.streets[s];
        for (k = 0; k < ln.length; k++) {
          if (inPoly(el.points, ln[k].x, ln[k].z)) stampCorridor(ln[k].x, ln[k].z, el.params.gasse * 0.5 + 1.2);
        }
      }
    }
  }
}

/** Terrain aus Basis + Flüssen neu berechnen und hochladen. */
function refreshTerrainFull() {
  recomputeHeights(0, VW - 1, 0, VW - 1);
  computeAO(0, VW - 1, 0, VW - 1);
  refreshGrid(0, VW - 1, 0, VW - 1);
}

/** Vollständiger Neuaufbau (Laden, Undo, Seed-Wechsel). */
function rebuildAll() {
  rebuildRivers();
  refreshTerrainFull();
  rebuildCorridors();
  for (var i = 0; i < elements.length; i++) genElement(elements[i]);
  markDirty();
}

/** Änderung an einem Element übernehmen. heavy = Terrain/Korridore betroffen. */
function commit(el, heavy) {
  if (heavy) {
    rebuildRivers();
    refreshTerrainFull();
    rebuildCorridors();
    for (var i = 0; i < elements.length; i++) genElement(elements[i]);
    markDirty();
  } else if (el) {
    regenElement(el);
  }
}
/** Ändert ein Element das Terrain oder die Sperrflächen? */
function isHeavy(el) {
  return (el.kind === "pfad" && (el.variant === "strasse" || el.variant === "fluss" || el.variant === "mauer")) ||
         (el.kind === "flaeche" && el.variant === "viertel");
}

var focus = { x: 0, z: 0 }, tFocus = { x: 0, z: 0 };
var focusY = 0, tFocusY = 0;
var dist = 120, tDist = 120;
var yaw = 0.7, tYaw = 0.7;
var pitch = 42 * DEG, tPitch = 42 * DEG;
var DAMP = 0.15;

function zoomT() { return clamp((tDist - 25) / (400 - 25), 0, 1); }
/** Auto-Flatten: nah = flach (30°), fern = steiler (60°). */
function autoPitch() { return lerp(30, 60, zoomT()) * DEG; }

function updateCamera(dt) {
  var f = 1 - Math.pow(1 - DAMP, dt * 60);
  focus.x += (tFocus.x - focus.x) * f;
  focus.z += (tFocus.z - focus.z) * f;
  dist += (tDist - dist) * f;
  yaw += (tYaw - yaw) * f;
  pitch += (tPitch - pitch) * f;
  tFocusY = heightAt(focus.x, focus.z);
  focusY += (tFocusY - focusY) * f * 0.6;
  var cp = Math.cos(pitch), sp = Math.sin(pitch);
  var cx = focus.x + dist * cp * Math.sin(yaw);
  var cz = focus.z + dist * cp * Math.cos(yaw);
  var cy = focusY + dist * sp;
  var floor = heightAt(cx, cz) + 4;
  if (cy < floor) cy = floor;
  camera.position.set(cx, cy, cz);
  camera.lookAt(focus.x, focusY, focus.z);
  sky.position.copy(camera.position);
}

var keys = {};
window.addEventListener("keydown", function (e) {
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  keys[e.code] = true;
  onKey(e);
});
window.addEventListener("keyup", function (e) { keys[e.code] = false; });
window.addEventListener("blur", function () { keys = {}; });

function moveFocus(dt) {
  var sp = dist * 0.55 * dt;
  var fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  var rx = -fz, rz = fx;
  var mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) { mx += fx; mz += fz; }
  if (keys.KeyS || keys.ArrowDown) { mx -= fx; mz -= fz; }
  if (keys.KeyD || keys.ArrowRight) { mx += rx; mz += rz; }
  if (keys.KeyA || keys.ArrowLeft) { mx -= rx; mz -= rz; }
  if (mx || mz) {
    var l = Math.sqrt(mx * mx + mz * mz);
    tFocus.x = clamp(tFocus.x + mx / l * sp, -HALF - 40, HALF + 40);
    tFocus.z = clamp(tFocus.z + mz / l * sp, -HALF - 40, HALF + 40);
  }
  if (keys.KeyQ) tYaw += 1.4 * dt;
  if (keys.KeyE) tYaw -= 1.4 * dt;
}

/* --- Strahlen gegen das Heightfield (schneller als Mesh-Raycast) -------- */
var raycaster = new THREE.Raycaster();
var _ndc = new THREE.Vector2();
function rayFrom(ev) {
  _ndc.x = (ev.clientX / window.innerWidth) * 2 - 1;
  _ndc.y = -((ev.clientY / window.innerHeight) * 2 - 1);
  raycaster.setFromCamera(_ndc, camera);
  return raycaster.ray;
}
function rayTerrain(ray) {
  var o = ray.origin, d = ray.direction, t = 0, step;
  for (var i = 0; i < 900; i++) {
    step = Math.max(1.0, t * 0.02);
    var nt = t + step;
    var x = o.x + d.x * nt, y = o.y + d.y * nt, z = o.z + d.z * nt;
    if (y - heightAt(x, z) <= 0) {
      var lo = t, hi = nt;
      for (var b = 0; b < 22; b++) {
        var mid = (lo + hi) * 0.5;
        if ((o.y + d.y * mid) - heightAt(o.x + d.x * mid, o.z + d.z * mid) > 0) lo = mid; else hi = mid;
      }
      var ft = (lo + hi) * 0.5;
      return new THREE.Vector3(o.x + d.x * ft, o.y + d.y * ft, o.z + d.z * ft);
    }
    t = nt;
    if (t > 2400) break;
  }
  return null;
}
function rayPlane(ray, y) {
  var d = ray.direction;
  if (Math.abs(d.y) < 1e-6) return null;
  var t = (y - ray.origin.y) / d.y;
  if (t < 0) return null;
  return new THREE.Vector3(ray.origin.x + d.x * t, y, ray.origin.z + d.z * t);
}
function groundPoint(ev) {
  var ray = rayFrom(ev);
  return rayTerrain(ray) || rayPlane(ray, focusY) || null;
}

var previewGeo = new THREE.BufferGeometry();

function setPreview(points, cursor, closed) {
  var arr = previewGeo.attributes.position.array;
  var n = 0, i;
  function put(p) {
    if (n >= 500) return;
    arr[n * 3] = p.x; arr[n * 3 + 1] = heightAt(p.x, p.z) + 0.6; arr[n * 3 + 2] = p.z; n++;
  }
  // Zwischenpunkte für eine weiche Vorschau der Kurve
  var pts = points.slice();
  if (cursor) pts.push(cursor);
  if (pts.length >= 2 && !closed) {
    var sm = pathSamples(pts, 2.5);
    for (i = 0; i < sm.length; i++) put(sm[i]);
  } else {
    for (i = 0; i < pts.length; i++) put(pts[i]);
    if (closed && pts.length > 2) put(pts[0]);
  }
  previewGeo.attributes.position.needsUpdate = true;
  previewGeo.setDrawRange(0, n);
  preview.visible = n > 1;
}
function clearPreview() { preview.visible = false; previewGeo.setDrawRange(0, 0); }

function rebuildHandles() {
  for (var i = handles.children.length - 1; i >= 0; i--) handles.remove(handles.children[i]);
  var list = [];
  if (draw) list = draw.points;
  else if (selected) list = selected.points;
  for (var k = 0; k < list.length; k++) {
    var m = new THREE.Mesh(dotGeo, draw ? dotMatA : dotMatB);
    m.userData.idx = k;
    handles.add(m);

}

    var p = list[i];

    handles.children[i].position.set(p.x, heightAt(p.x, p.z) + 0.9, p.z);
    handles.children[i].scale.setScalar(s);
  }
}

var brushRing = (function () {
  var N = 64, pos = new Float32Array((N + 1) * 3);

  for (var i = 0; i <= N; i++) {

    arr[i * 3] = x; arr[i * 3 + 1] = heightAt(x, z) + 0.35; arr[i * 3 + 2] = z;

   15 — Terrain-Pinsel
   ========================================================================== */

var flattenTarget = 0;
function applyBrush(p, mode, radius, strength, dt) {
  var r = radius, i0 = Math.floor(p.x + HALF - r), i1 = Math.ceil(p.x + HALF + r);
  var j0 = Math.floor(p.z + HALF - r), j1 = Math.ceil(p.z + HALF + r);
  i0 = clamp(i0, 0, VW - 1); i1 = clamp(i1, 0, VW - 1);
  j0 = clamp(j0, 0, VW - 1); j1 = clamp(j1, 0, VW - 1);
  var amt = strength * dt * 60 * 0.35;
  for (var j = j0; j <= j1; j++) {
    for (var i = i0; i <= i1; i++) {
      var dx = (i - HALF) - p.x, dz = (j - HALF) - p.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      if (d > r) continue;
      var w = sstep(r, r * 0.25, d);
      var id = j * VW + i;
      if (mode === "heben") base[id] += amt * w;
      else if (mode === "senken") base[id] -= amt * w;
      else if (mode === "ebnen") base[id] = lerp(base[id], flattenTarget, clamp(w * amt * 0.5, 0, 1));
      else if (mode === "glaetten") {
        var il = Math.max(0, i - 1), ir2 = Math.min(VW - 1, i + 1);
        var jd = Math.max(0, j - 1), ju = Math.min(VW - 1, j + 1);
        var avg = (base[j * VW + il] + base[j * VW + ir2] + base[jd * VW + i] + base[ju * VW + i]) * 0.25;
        base[id] = lerp(base[id], avg, clamp(w * amt * 0.6, 0, 1));
      }
    }
  }
  var m = Math.ceil(r) + 2;
  recomputeHeights(i0 - m, i1 + m, j0 - m, j1 + m);
  computeAO(i0 - m - 1, i1 + m + 1, j0 - m - 1, j1 + m + 1);
  refreshGrid(i0 - m, i1 + m, j0 - m, j1 + m);
}

    : (TOOLS.filter(function (t) { return t.id === tool; })[0] || { l: tool }).l;
  panelEl.appendChild(el("div", "ph", head));

  // Varianten
  if (VARIANTS[kind] && VARIANTS[kind].length > 1) {
    var seg = el("div", "seg");
    for (var i = 0; i < VARIANTS[kind].length; i++) {
      (function (v) {
        var b = el("button", v[0] === variant ? "on" : "", v[1]);
        b.addEventListener("click", function () {
          if (target) {
            pushUndo();
            target.variant = v[0];
            var nd = defaultsFor(target.kind, v[0]);
            for (var k in nd) if (target.params[k] === undefined) target.params[k] = nd[k];
            commit(target, true);
          } else {
            variantOf[kind] = v[0];
            if (draw) draw.variant = v[0];
          }
          buildPanel();
          updateHint();
        });
        seg.appendChild(b);
      })(VARIANTS[kind][i]);
    }
    var wrap = el("div", "row");
    wrap.appendChild(seg);
    panelEl.appendChild(wrap);
  }

  // Parameter
  var defs = PARAMS[schemaKey(kind, variant)] || [];
  var applyFn = function (isUndoPoint) {
    if (isUndoPoint === true) { if (target) pushUndo(); return; }
    if (target) commit(target, isHeavy(target));
  };
  for (var d = 0; d < defs.length; d++) {
    if (obj[defs[d].k] === undefined) obj[defs[d].k] = defs[d].d;
    panelEl.appendChild(paramRow(defs[d], obj, applyFn));
  }

  if (target) {
    panelEl.appendChild(el("hr"));
    var reroll = el("button", "btn", "🎲  Neu würfeln");
    reroll.addEventListener("click", function () {
      pushUndo();
      target.seed = (target.seed + 0x9e3779b9) | 0;
      commit(target, isHeavy(target));
      toast("Bestückung neu gewürfelt");
    });
    panelEl.appendChild(reroll);
    var del = el("button", "btn warn", "Löschen  (Entf)");
    del.addEventListener("click", function () {
      pushUndo();
      var heavy = isHeavy(target);
      dropElement(target);
      selected = null;
      rebuildHandles();
      commit(null, heavy);
      buildPanel();
    });
    panelEl.appendChild(del);
    panelEl.appendChild(el("div", "psub", "Punkte ziehen verändert die Form — die Bestückung " +
      "wird dabei neu erzeugt."));
  } else if (kind === "terrain") {
    panelEl.appendChild(el("div", "psub", "Ziehen verformt das Terrain. „Einebnen“ nimmt die Höhe " +
      "des ersten Klicks als Ziel."));
  } else if (kind === "pfad" || kind === "flaeche") {
    panelEl.appendChild(el("div", "psub", "Klicken setzt Punkte, Doppelklick oder Enter schließt ab, " +
      "Esc bricht ab."));
  }
}

function updateHint() {
  var h = document.getElementById("hint");
  var txt;
  if (draw) txt = "<b>" + draw.points.length + (draw.points.length === 1 ? " Punkt" : " Punkte") +
    "</b> — Doppelklick oder <b>Enter</b> beendet, <b>Esc</b> bricht ab";
  else if (tool === "pfad") txt = "<b>Pfad</b> zeichnen: klicken, Doppelklick beendet";
  else if (tool === "flaeche") txt = "<b>Fläche</b> zeichnen: klicken, Doppelklick schließt das Polygon";
  else if (tool === "objekt") txt = "<b>Klicken</b> platziert, <b>Ziehen</b> streut";
  else if (tool === "ranke") txt = "<b>Klicken</b> pflanzt eine Ranke";
  else if (tool === "terrain") txt = "<b>Ziehen</b> formt das Terrain";
  else txt = "<b>Klick</b> wählt aus · Griffe ziehen · <b>Entf</b> löscht";
  h.innerHTML = txt + "<br>WASD bewegen · Q/E drehen · Rad zoomen · Rechte Maus schwenken";
}

var toastT = 0;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  toastT = performance.now() + 1600;
}

function updateStats() {
  document.getElementById("stats").innerHTML =
    Math.round(fps) + " <span>fps</span> &nbsp; " +
    infoCalls + " <span>calls</span> &nbsp; " +
    (infoTris > 99999 ? Math.round(infoTris / 1000) + "k" : infoTris.toLocaleString("de-DE")) +
    " <span>tris</span> &nbsp; " +
    (instanceTotal + schattenAnzahl).toLocaleString("de-DE") + " <span>Instanzen</span> &nbsp; " +
    elements.length + " <span>Elemente</span>";
}

/* ==========================================================================
   21 — Untere Leiste: Seed, Tageszeit, Raster, Speichern, Laden, PNG
   ========================================================================== */

document.getElementById("seedApply").addEventListener("click", function () {
  var v = document.getElementById("seed").value.trim();
  var s = 0;
  if (/^-?\d+$/.test(v)) s = parseInt(v, 10) | 0;
  else { for (var i = 0; i < v.length; i++) s = (Math.imul(s, 31) + v.charCodeAt(i)) | 0; }
  pushUndo();
  worldSeed = s;
  genBase(worldSeed);
  rebuildAll();
  toast("Neue Karte mit Seed " + v);
});
var todBtns = document.querySelectorAll("#bar .tod");
for (var ti = 0; ti < todBtns.length; ti++) {
  todBtns[ti].addEventListener("click", function () { setTod(this.dataset.t, false); });
}
document.getElementById("snapBtn").addEventListener("click", function () {
  snap = !snap;
  this.classList.toggle("on", snap);
  toast(snap ? "Raster-Einrasten an (2 Einheiten)" : "Raster-Einrasten aus");
});
function download(name, blob) {
  var a = document.createElement("a");
  var url = URL.createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
document.getElementById("saveBtn").addEventListener("click", function () {
  var hs = new Array(base.length);
  for (var i = 0; i < base.length; i++) hs[i] = Math.round(base[i] * 100) / 100;
  var data = {
    format: "terra", version: 2, seed: worldSeed, tageszeit: todName, raster: snap,
    kamera: { x: tFocus.x, z: tFocus.z, dist: tDist, yaw: tYaw, pitch: tPitch },
    hoehen: hs,
    elemente: serializeElements()
  };
  download("terra-karte.json", new Blob([JSON.stringify(data)], { type: "application/json" }));
  toast("Karte gespeichert");
});
document.getElementById("loadBtn").addEventListener("click", function () {
  document.getElementById("fileIn").click();
});
document.getElementById("fileIn").addEventListener("change", function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!d || !d.hoehen || !d.elemente) throw new Error("Unbekanntes Format");
      // Dateien ohne Versionsfeld stammen aus Fassung 1 und werden weiter gelesen;
      // fehlende Parameter ergänzt genElement aus dem Schema.
      var dateiVersion = d.version || 1;
      pushUndo();
      worldSeed = d.seed | 0;
      document.getElementById("seed").value = String(worldSeed);
      for (var i = 0; i < base.length && i < d.hoehen.length; i++) base[i] = d.hoehen[i];
      hydrate(d.elemente);
      if (d.kamera) {
        tFocus.x = d.kamera.x; tFocus.z = d.kamera.z;
        tDist = d.kamera.dist; tYaw = d.kamera.yaw; tPitch = d.kamera.pitch;
      }
      snap = !!d.raster;
      document.getElementById("snapBtn").classList.toggle("on", snap);
      rebuildAll();
      rebuildHandles();
      buildPanel();
      setTod(d.tageszeit || "mittag", true);
      toast(dateiVersion < 2 ? "Karte geladen (ältere Fassung)" : "Karte geladen");
    } catch (err) {
      toast("Datei konnte nicht gelesen werden");
    }
  };
  rd.readAsText(f);
  e.target.value = "";
});
document.getElementById("pngBtn").addEventListener("click", function () {
  var pv = preview.visible, hv = handles.visible, bv = brushRing.visible;
  preview.visible = false; handles.visible = false; brushRing.visible = false;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(postScene, postCam);          // Korn gehört mit ins Bild
  renderer.autoClear = true;
  var url = renderer.domElement.toDataURL("image/png");
  preview.visible = pv; handles.visible = hv; brushRing.visible = bv;
  var a = document.createElement("a");
  a.href = url; a.download = "terra-ansicht.png";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast("PNG exportiert");
});

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  grainSkalieren();
});

/* ==========================================================================
   22 — Wasserwellen, Bildschleife
   ========================================================================== */

var _wasserFrustum = new THREE.Frustum(), _wasserM = new THREE.Matrix4();
var _wasserBox = new THREE.Box3();
/** Wogen nur berechnen, wenn die Wasserfläche überhaupt im Bild liegt. */
function wasserSichtbar() {
  _wasserM.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _wasserFrustum.setFromProjectionMatrix(_wasserM);
  var r = todCur.far;
  _wasserBox.min.set(focus.x - r, -1.5, focus.z - r);
  _wasserBox.max.set(focus.x + r, 1.5, focus.z + r);
  return _wasserFrustum.intersectsBox(_wasserBox);
}
function updateWater(t) {
  var p = waterGeo.attributes.position, arr = p.array;
  for (var i = 0; i < p.count; i++) {
    var x = waterBaseXZ[i * 2], z = waterBaseXZ[i * 2 + 1];
    arr[i * 3 + 1] = Math.sin(x * 0.045 + t * 0.7) * 0.32 + Math.sin(z * 0.031 - t * 0.55) * 0.26
      + Math.sin((x + z) * 0.018 + t * 0.35) * 0.2;
  }
  p.needsUpdate = true;
}

/* --- Nachbearbeitung: feines Korn über das fertige Bild --------------- */
var postScene = new THREE.Scene();
var postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
var grainMat = new THREE.MeshBasicMaterial({
  map: TEX.grain, transparent: true, opacity: 0.045,
  depthTest: false, depthWrite: false
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat));
function grainSkalieren() {
  TEX.grain.repeat.set(window.innerWidth / 128, window.innerHeight / 128);
}
grainSkalieren();

var fps = 60, frameCount = 0, fpsAcc = 0, lastT = performance.now();
var infoCalls = 0, infoTris = 0;
function animate() {
  requestAnimationFrame(animate);
  var now = performance.now();
  var raw = (now - lastT) / 1000;          // echte Bildzeit für die Anzeige
  var dt = Math.min(0.05, raw);            // geklammert für stabile Bewegung
  lastT = now;

  verarbeiteZeiger(now);
  moveFocus(dt);
  updateCamera(dt);
  if (todT < 1) { todT = Math.min(1, todT + Math.min(0.3, raw) / 1.1); applyTod(todT); }
  updateClouds(dt);
  updateBirds(dt, now * 0.001);
  updateRauch(now * 0.001);
  water.visible = wasserSichtbar();
  if (water.visible) updateWater(now * 0.001);
  flushPack();
  updateHandlePositions();
  if (toastT && now > toastT) {
    document.getElementById("toast").classList.remove("show");
    toastT = 0;
  }
  renderer.render(scene, camera);
  infoCalls = renderer.info.render.calls;      // vor dem Korn-Pass sichern
  infoTris = renderer.info.render.triangles;
  renderer.autoClear = false;
  renderer.render(postScene, postCam);
  renderer.autoClear = true;

  frameCount++; fpsAcc += raw;
  if (fpsAcc > 0.5) { fps = frameCount / fpsAcc; frameCount = 0; fpsAcc = 0; updateStats(); }
}

/* ==========================================================================
   23 — Startkarte und Initialisierung
   ========================================================================== */

/** Sucht in der Nähe einen brauchbaren Bauplatz (Land, flach genug). */
function findLand(cx, cz, minH, maxH) {
  for (var r = 0; r <= 90; r += 5) {
    for (var a = 0; a < 16; a++) {
      var ang = a / 16 * Math.PI * 2 + r * 0.3;
      var x = cx + Math.cos(ang) * r, z = cz + Math.sin(ang) * r;
      if (x < -HALF + 20 || x > HALF - 20 || z < -HALF + 20 || z > HALF - 20) continue;
      var h = heightAt(x, z);
      if (h < minH || h > maxH) continue;
      if (slopeAt(x, z) < Math.cos(18 * DEG)) continue;
      return { x: Math.round(x), z: Math.round(z) };
    }
  }
  return { x: cx, z: cz };
}
function addEl(kind, variant, points, over) {
  var p = defaultsFor(kind, variant);
  if (over) for (var k in over) p[k] = over[k];
  var e = mkElement(kind, variant, points, p, nextSeed());
  elements.push(e);
  return e;
}
function ring(c, r, n, wob, seed) {
  var out = [];
  for (var i = 0; i < n; i++) {
    var a = i / n * Math.PI * 2;
    var rr2 = r * (1 + (hashi(i, 0, seed) - 0.5) * wob);
    out.push({ x: Math.round(c.x + Math.cos(a) * rr2), z: Math.round(c.z + Math.sin(a) * rr2) });
  }
  return out;
}

/** Kleine Beispielkarte, damit beim Öffnen sofort etwas zu sehen ist. */
function demoMap() {
  // Blickrichtung der Startkamera, damit die Komposition sofort sitzt
  var vx = -Math.sin(0.85), vz = -Math.cos(0.85);      // vom Fokus weg
  var px = -vz, pz = vx;                                // quer dazu

  var town = findLand(20, 20, 2.5, 11);
  function bei(f, q, lo, hi) {
    return findLand(town.x + vx * f + px * q, town.z + vz * f + pz * q, lo, hi);
  }
  var v1 = bei(96, -8, 1.5, 15);
  var v2 = bei(150, 78, 1.5, 15);
  var wood = bei(40, 78, 1.5, 13);
  var field = bei(-30, 62, 1.5, 9);
  var meadow = bei(55, -70, 1.5, 9);
  var klass = bei(-46, -52, 2.5, 12);
  var zwerg = bei(78, -46, 3, 16);
  var elfen = bei(30, 104, 2, 12);

  addEl("ranke", "ranke", [{ x: v1.x, z: v1.z }],
    { hoehe: 215, straenge: 7, plateaus: 3, staedtchen: true, inseln: 2 });
  addEl("ranke", "ranke", [{ x: v2.x, z: v2.z }],
    { hoehe: 145, straenge: 5, plateaus: 2, staedtchen: true, inseln: 1 });

  addEl("pfad", "strasse", [
    { x: v1.x + 16, z: v1.z + 10 },
    { x: (v1.x + town.x) / 2 + 10, z: (v1.z + town.z) / 2 - 8 },
    { x: town.x - 6, z: town.z - 4 },
    { x: town.x + 44, z: town.z + 22 }
  ], { breite: 6, abstand: 15, haeuser: true, stil: "dorf" });

  // vier Siedlungen in vier Baustilen
  addEl("flaeche", "viertel", ring(town, 30, 9, 0.26, 11),
    { netz: "gebogen", block: 21, gasse: 3.5, dichte: 1.25, stil: "dorf" });
  addEl("flaeche", "viertel", ring(klass, 24, 8, 0.2, 71),
    { netz: "raster", block: 20, gasse: 4, dichte: 1.1, stil: "klassisch", drehung: 40 });
  addEl("flaeche", "viertel", ring(zwerg, 20, 7, 0.24, 83),
    { netz: "zellen", block: 17, gasse: 4, dichte: 1.2, stil: "zwergisch" });
  addEl("flaeche", "viertel", ring(elfen, 22, 8, 0.28, 97),
    { netz: "ring", block: 16, gasse: 3, dichte: 1.0, stil: "elfisch" });

  addEl("flaeche", "wald", ring(wood, 44, 11, 0.3, 23), { dichte: 1.3, mischung: 0.28 });
  addEl("flaeche", "feld", ring(field, 28, 7, 0.2, 41), { drehung: 55, reihe: 3.2 });
  addEl("flaeche", "wiese", ring(meadow, 26, 8, 0.25, 57), { dichte: 1.4, blumen: 0.45 });
  addEl("pfad", "hecke", [
    { x: field.x - 26, z: field.z + 26 },
    { x: field.x + 8, z: field.z + 34 },
    { x: field.x + 38, z: field.z + 22 }
  ], { stil: "hecke" });
  addEl("objekt", "haeuser", [{ x: field.x + 20, z: field.z - 14 }],
    { anzahl: 1, streuung: 0, groesse: 1.15, frei: false, nurTyp: "windmuehle" });

  return { x: town.x + vx * 42, z: town.z + vz * 42 };
}

function init() {
  genBase(worldSeed);
  refreshTerrainFull();
  var c = demoMap();
  rebuildAll();
  flushPack();

  tFocus.x = focus.x = c.x;
  tFocus.z = focus.z = c.z;
  focusY = heightAt(focus.x, focus.z);
  tDist = dist = 120;
  tYaw = yaw = 0.85;
  tPitch = pitch = 42 * DEG;

  setTod("mittag", true);
  buildRail();
  buildPanel();
  updateHint();
  updateStats();
  animate();
}

init();

})();
}
