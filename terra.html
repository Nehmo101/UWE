<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terra — Fantasy-Karteneditor</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e9eff3;
    font:13px/1.45 "Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",sans-serif;
    color:#3d4753;-webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block;position:fixed;left:0;top:0;z-index:0}
  #ui{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:10}
  #ui>*{pointer-events:auto}
  .card{background:rgba(255,255,255,.84);border:1px solid rgba(150,168,186,.34);
    border-radius:16px;box-shadow:0 6px 20px rgba(92,116,140,.13);backdrop-filter:blur(9px)}

  /* linke Werkzeugleiste */
  #rail{position:absolute;left:16px;top:16px;width:66px;display:flex;flex-direction:column;gap:9px}
  .tool{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;transition:.16s;position:relative;color:#55606d}
  .tool:hover{background:rgba(255,255,255,.95);transform:translateY(-1px)}
  .tool .g{font-size:19px;line-height:1}
  .tool .l{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.62}
  .tool .k{position:absolute;top:5px;right:8px;font-size:8.5px;opacity:.38}
  .tool.on{background:#fff;border-color:#9dc0dc;color:#2d74ab;box-shadow:0 8px 22px rgba(88,132,176,.24)}

  /* rechtes Parameter-Panel */
  #panel{position:absolute;right:16px;top:62px;width:250px;max-height:calc(100% - 152px);
    overflow-y:auto;overflow-x:hidden;padding:14px 15px 16px}
  #panel::-webkit-scrollbar{width:7px}
  #panel::-webkit-scrollbar-thumb{background:rgba(140,160,180,.4);border-radius:4px}
  .ph{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.5;margin:0 0 10px}
  .psub{font-size:11.5px;opacity:.62;margin:-4px 0 12px;line-height:1.4}
  .row{margin:0 0 12px}
  .row label{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
  .row label b{font-weight:600;opacity:.55;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:16px;-webkit-appearance:none;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:#dbe3ea}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;
    border-radius:50%;background:#fff;border:2px solid #7fa9cc;box-shadow:0 1px 4px rgba(80,110,140,.3)}
  input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:#dbe3ea}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;
    border:2px solid #7fa9cc}
  select,input[type=text],input[type=number]{width:100%;padding:6px 8px;border-radius:9px;
    border:1px solid rgba(150,168,186,.5);background:rgba(255,255,255,.9);font:inherit;font-size:12px;color:#3d4753}
  select:focus,input:focus{outline:2px solid rgba(127,169,204,.45);outline-offset:0}
  .seg{display:flex;flex-wrap:wrap;gap:5px}
  .seg button{flex:1 1 auto;min-width:52px;padding:6px 4px;border-radius:9px;font:inherit;font-size:11px;
    border:1px solid rgba(150,168,186,.45);background:rgba(255,255,255,.72);cursor:pointer;color:#4b5561}
  .seg button:hover{background:#fff}
  .seg button.on{background:#2d74ab;border-color:#2d74ab;color:#fff}
  .chk{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
  .chk input{width:15px;height:15px;accent-color:#2d74ab}
  .btn{display:block;width:100%;padding:8px;border-radius:10px;border:1px solid rgba(150,168,186,.45);
    background:rgba(255,255,255,.8);cursor:pointer;font:inherit;font-size:12px;color:#44505d;margin-top:7px}
  .btn:hover{background:#fff}
  .btn.warn:hover{background:#fff0f0;border-color:#e0a5a5;color:#a34b4b}
  hr{border:0;border-top:1px solid rgba(150,168,186,.3);margin:13px 0}

  /* untere Leiste */
  #bar{position:absolute;left:0;right:0;bottom:16px;margin:0 auto;width:fit-content;
    max-width:calc(100% - 32px);display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;gap:8px;padding:9px 12px}
  #bar .sep{width:1px;height:24px;background:rgba(150,168,186,.35)}
  #bar label{font-size:11px;opacity:.55;letter-spacing:.04em}
  #seed{width:88px;text-align:center;font-variant-numeric:tabular-nums}
  #bar button{padding:7px 11px;border-radius:9px;border:1px solid rgba(150,168,186,.45);
    background:rgba(255,255,255,.75);cursor:pointer;font:inherit;font-size:12px;color:#48535f}
  #bar button:hover{background:#fff}
  #bar button.on{background:#2d74ab;border-color:#2d74ab;color:#fff}

  /* Statusanzeige */
  #stats{position:absolute;right:16px;top:16px;padding:7px 11px;font-size:11px;
    font-variant-numeric:tabular-nums;opacity:.85;letter-spacing:.02em}
  #stats span{opacity:.5}
  #hint{position:absolute;left:16px;bottom:76px;max-width:300px;padding:8px 12px;font-size:11.5px;
    line-height:1.5;opacity:.9}
  #hint b{font-weight:600;color:#2d74ab}
  #toast{position:absolute;left:50%;top:24px;transform:translateX(-50%);padding:9px 16px;font-size:12px;
    opacity:0;transition:opacity .35s;pointer-events:none!important}
  #toast.show{opacity:1}
  #fail{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 26px;
    max-width:460px;display:none;line-height:1.6}
</style>
</head>
<body>
<div id="ui">
  <div id="rail"></div>
  <div id="panel" class="card"></div>
  <div id="bar" class="card">
    <label for="seed">Seed</label>
    <input id="seed" type="text" value="1337" spellcheck="false">
    <button id="seedApply">Übernehmen</button>
    <div class="sep"></div>
    <label>Tageszeit</label>
    <button class="tod" data-t="morgen">Morgen</button>
    <button class="tod" data-t="mittag">Mittag</button>
    <button class="tod" data-t="abend">Abendrot</button>
    <button class="tod" data-t="nebel">Nebel</button>
    <div class="sep"></div>
    <button id="snapBtn">Raster</button>
    <div class="sep"></div>
    <button id="saveBtn">Speichern</button>
    <button id="loadBtn">Laden</button>
    <button id="pngBtn">PNG</button>
  </div>
  <div id="stats" class="card"></div>
  <div id="hint" class="card"></div>
  <div id="toast" class="card"></div>
  <div id="fail" class="card">
    <b>three.js konnte nicht geladen werden.</b><br>
    terra.html lädt three.js r128 per Script-Tag vom CDN. Bitte einmalig mit Internetverbindung öffnen
    (danach liegt die Datei im Browser-Cache).
  </div>
</div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if (typeof THREE === "undefined") {
  document.getElementById("fail").style.display = "block";
} else {
(function () {

/* ==========================================================================
   0 — Grundlagen: Mathematik, deterministisches Rauschen, Zufall mit Seed
   ========================================================================== */

var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
var lerp = function (a, b, t) { return a + (b - a) * t; };
/** Smoothstep zwischen zwei Kanten; e1 darf kleiner als e0 sein. */
function sstep(e0, e1, x) {
  var t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
var DEG = Math.PI / 180;

/** Integer-Hash → 0..1. Grundlage für alles Zufällige im Programm. */
function hashi(x, y, s) {
  var h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/** Geglättetes 2D-Value-Noise (bilinear + Smoothstep). */
function vnoise(x, z, s) {
  var xi = Math.floor(x), zi = Math.floor(z);
  var fx = x - xi, fz = z - zi;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  var a = hashi(xi, zi, s), b = hashi(xi + 1, zi, s);
  var c = hashi(xi, zi + 1, s), d = hashi(xi + 1, zi + 1, s);
  var ab = a + (b - a) * fx, cd = c + (d - c) * fx;
  return ab + (cd - ab) * fz;
}

/**
 * 4 Oktaven fraktales Rauschen, Rückgabe 0..1. Die Summe der Oktaven drängt
 * zur Mitte, deshalb wird sie zum Schluss über eine S-Kurve gespreizt —
 * sonst bliebe die Karte eine gleichförmige Ebene.
 */
function fractal(x, z, s, oct) {
  oct = oct || 4;
  var sum = 0, amp = 1, norm = 0, f = 1;
  for (var i = 0; i < oct; i++) {
    sum += vnoise(x * f, z * f, (s + i * 1013) | 0) * amp;
    norm += amp; amp *= 0.5; f *= 2;
  }
  var v = sum / norm;
  v = v * v * (3 - 2 * v);
  return clamp((v - 0.5) * 1.4 + 0.5, 0, 1);
}

/** Deterministischer Zufallsstrom (mulberry32) — ersetzt Math.random komplett. */
function rngOf(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rr(rng, a, b) { return a + (b - a) * rng(); }
function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
/** Gewichtete Auswahl aus [[wert, gewicht], ...] */
function wpick(rng, table) {
  var total = 0, i;
  for (i = 0; i < table.length; i++) total += table[i][1];
  var r = rng() * total;
  for (i = 0; i < table.length; i++) { r -= table[i][1]; if (r <= 0) return table[i][0]; }
  return table[table.length - 1][0];
}

/* ==========================================================================
   0b — Texturfabrik: alles im Canvas gezeichnet, keine externe Datei.
        Läuft einmal beim Start; alles Zufällige über hashi/vnoise mit Seed.
   ========================================================================== */

var TEX = {};
function texCanvas(size) {
  var c = document.createElement("canvas");
  c.width = c.height = size;
  return c;
}
function texFinish(canvas, name, wrap) {
  var t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.needsUpdate = true;
  TEX[name] = t;
  return t;
}
/** Schreibt ein per-Pixel erzeugtes Bild; fn(u, v, out[4]) liefert RGBA 0..1. */
function texPaint(size, fn) {
  var c = texCanvas(size), ctx = c.getContext("2d");
  var img = ctx.createImageData(size, size), d = img.data, out = [1, 1, 1, 1];
  for (var j = 0; j < size; j++) {
    for (var i = 0; i < size; i++) {
      out[0] = out[1] = out[2] = 1; out[3] = 0;
      fn((i + 0.5) / size, (j + 0.5) / size, out);
      var k = (j * size + i) * 4;
      d[k] = clamp(out[0], 0, 1) * 255;
      d[k + 1] = clamp(out[1], 0, 1) * 255;
      d[k + 2] = clamp(out[2], 0, 1) * 255;
      d[k + 3] = clamp(out[3], 0, 1) * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

(function bauTexturen() {
  // --- Kontaktschatten: radialer Alphaverlauf, Mitte 55 %, Rand 0, unrund ---
  texFinish(texPaint(128, function (u, v, o) {
    var dx = (u - 0.5) * 2, dy = (v - 0.5) * 2;
    var r = Math.sqrt(dx * dx + dy * dy), a = Math.atan2(dy, dx);
    var wob = 1 + (vnoise(Math.cos(a) * 2.3 + 5, Math.sin(a) * 2.3 + 5, 9911) - 0.5) * 0.3;
    o[3] = Math.pow(1 - clamp(r / wob, 0, 1), 1.7) * 0.55;
  }), "shadowBlob", false);

  // --- Wolkenballen: überlagerte Keulen, Oberkante hart, Unterkante weich ---
  var lobes = [];
  for (var k = 0; k < 6; k++) {
    lobes.push({
      x: 0.5 + (hashi(k, 1, 771) - 0.5) * 0.52,
      y: 0.60 + (hashi(k, 2, 771) - 0.5) * 0.24,
      r: 0.17 + hashi(k, 3, 771) * 0.20
    });
  }
  texFinish(texPaint(256, function (u, v, o) {
    var a = 0;
    for (var l = 0; l < lobes.length; l++) {
      var L = lobes[l], dx = u - L.x, dy = (v - L.y) * 1.45;
      a = Math.max(a, 1 - clamp(Math.sqrt(dx * dx + dy * dy) / L.r, 0, 1));
    }
    a *= 0.68 + fractal(u * 7.5, v * 7.5, 3131) * 0.62;
    var hart = 1 - sstep(0.28, 0.70, v);            // oben 1, unten 0
    var w = lerp(0.30, 0.045, hart);                 // schmale Kante oben
    o[3] = sstep(0.46 - w, 0.46 + w, clamp(a, 0, 1));
    var licht = 0.86 + (1 - v) * 0.14;
    o[0] = licht; o[1] = licht; o[2] = licht * 0.995;
  }), "cloudPuff", false);

  // --- Grasbüschel: 5–9 schmale, oben spitze Halme, reines Alpha ---
  var halme = 5 + Math.floor(hashi(7, 7, 5150) * 5);
  var halm = [];
  for (var h = 0; h < halme; h++) {
    halm.push({
      x: 0.12 + hashi(h, 11, 5150) * 0.76,
      b: 0.02 + hashi(h, 12, 5150) * 0.035,
      hoehe: 0.55 + hashi(h, 13, 5150) * 0.42,
      neig: (hashi(h, 14, 5150) - 0.5) * 0.34
    });
  }
  texFinish(texPaint(128, function (u, v, o) {
    var y = 1 - v;                                   // 0 unten
    var a = 0;
    for (var i = 0; i < halm.length; i++) {
      var H = halm[i];
      if (y > H.hoehe) continue;
      var t = y / H.hoehe;
      var mitte = H.x + H.neig * t * t;
      var br = H.b * (1 - t) + 0.004;
      var d = Math.abs(u - mitte);
      if (d < br) a = Math.max(a, 1 - sstep(br * 0.45, br, d));
    }
    o[3] = a;
    var g = 0.72 + y * 0.3;
    o[0] = g * 0.86; o[1] = g; o[2] = g * 0.62;
  }), "grassTuft", false);

  // --- Blatt: Oval mit Mittelrippe und Spitze ---
  texFinish(texPaint(128, function (u, v, o) {
    var t = u;                                       // 0 Stiel, 1 Spitze
    var hw = Math.sin(Math.PI * Math.pow(t, 0.7)) * 0.42 * (1 - t * 0.12);
    var d = Math.abs(v - 0.5);
    if (d > hw || t > 0.995) { o[3] = 0; return; }
    o[3] = 1 - sstep(hw * 0.82, hw, d);
    var rippe = 1 - Math.min(1, d / 0.035);
    var ader = 1 - Math.min(1, Math.abs(((t * 5 + d * 3) % 1) - 0.5) * 7);
    var hell = 0.82 + rippe * 0.35 + ader * 0.12 * t;
    o[0] = 0.30 * hell; o[1] = 0.44 * hell; o[2] = 0.24 * hell;
  }), "leafBlade", false);

  // --- Uferschaum: unregelmäßiger weicher weißer Streifen, kachelbar ---
  texFinish(texPaint(128, function (u, v, o) {
    var band = fractal(u * 5.5, v * 5.5, 4242);
    var streifen = 1 - Math.min(1, Math.abs(v - 0.5 + (band - 0.5) * 0.4) * 4.2);
    var a = Math.pow(clamp(streifen, 0, 1), 1.5) * (0.5 + band * 0.7);
    o[3] = clamp(a, 0, 1) * 0.85;
    o[0] = o[1] = o[2] = 1;
  }), "foamEdge", true);

  // --- Korn für den Nachbearbeitungs-Pass ---
  texFinish(texPaint(128, function (u, v, o) {
    var n = hashi(Math.round(u * 128), Math.round(v * 128), 8080);
    var g = 0.5 + (n - 0.5) * 0.85;
    o[0] = o[1] = o[2] = g;
    o[3] = 1;
  }), "grain", true);
})();

/* ==========================================================================
   1 — Weltkonstanten
   ========================================================================== */

var MAP = 256;                  // Kacheln pro Achse
var VW = MAP + 1;               // Vertices pro Achse
var HALF = MAP / 2;
var WATER = 0;                  // Wasserspiegel
var VINE_R = 6;                 // globaler Rankenradius am Fuß — Maßstabsanker
var COS40 = Math.cos(40 * DEG); // maximale Hangneigung für Bestückung
var MAX_INST_PER_EL = 24000;    // Sicherheitsnetz je Element

var worldSeed = 1337;

/* ==========================================================================
   2 — Renderer, Szene, Kamera, Licht, Himmel, Nebel
   ========================================================================== */

var renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true,  // für den PNG-Export
  powerPreference: "high-performance",
  alpha: false
});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.sortObjects = true;
document.body.appendChild(renderer.domElement);

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe8f0, 180, 900);

var camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(0, 120, 160);

// Die Bodenfarbe der Hemisphäre ist bewusst dunkel: sie erzeugt die
// Schattenseiten und damit den Tonwertumfang, den die Vorlagen haben.
var hemi = new THREE.HemisphereLight(0xcfe4f5, 0x4a4c40, 0.42);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff4e2, 0.62);
sun.position.set(180, 320, 140);
scene.add(sun);

/* --- Wrap-Beleuchtung: Phong-Shader defensiv patchen ------------------
   Kein eigenes ShaderMaterial — sonst gingen Instancing, Vertexfarben und
   Fog verloren. Jede Ersetzung wird geprüft; schlägt sie fehl, bleibt der
   Shader unverändert (lieber etwas flacher als schwarz).                */

var terraUniforms = {
  uRim: { value: new THREE.Color(0xdcefff) },
  uBounce: { value: new THREE.Color(0xe0d8c0) }
};
var patchInfo = { wrap: 0, rim: 0, hoehe: 0, versuche: 0 };

function terraPatch(shader) {
  patchInfo.versuche++;
  var kopfF = "uniform vec3 uRim;\nuniform vec3 uBounce;\n";
  shader.uniforms.uRim = terraUniforms.uRim;
  shader.uniforms.uBounce = terraUniforms.uBounce;

  // (1) Wrap-Diffuse mit drei weich verschliffenen Stufen und warmem Bounce
  var src = THREE.ShaderChunk.lights_phong_pars_fragment;
  var aAlt = "float dotNL = saturate( dot( geometry.normal, directLight.direction ) );";
  var bAlt = "vec3 irradiance = dotNL * directLight.color;";
  if (src && src.indexOf(aAlt) >= 0 && src.indexOf(bAlt) >= 0 &&
      shader.fragmentShader.indexOf("#include <lights_phong_pars_fragment>") >= 0) {
    var neu = src
      .replace(aAlt, "float dotNL = dot( geometry.normal, directLight.direction );")
      .replace(bAlt,
        "float terraW = dotNL * 0.5 + 0.5;\n" +
        "float terraB = smoothstep(0.26,0.32,terraW)*0.34\n" +
        "             + smoothstep(0.50,0.56,terraW)*0.33\n" +
        "             + smoothstep(0.74,0.80,terraW)*0.33;\n" +
        "terraB = 0.30 + 0.70 * terraB;\n" +
        "vec3 irradiance = terraB * directLight.color * mix( uBounce, vec3(1.0), terraB );");
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <lights_phong_pars_fragment>", neu);
    patchInfo.wrap++;
  }

  // (2) Rimlight über Fresnel — setzt Silhouetten gegen den Himmel ab
  var ende = "#include <lights_fragment_end>";
  if (shader.fragmentShader.indexOf(ende) >= 0) {
    shader.fragmentShader = shader.fragmentShader.replace(ende, ende + "\n" +
      "float terraRim = pow( 1.0 - max( dot( normal, normalize( vViewPosition ) ), 0.0 ), 3.0 );\n" +
      "terraRim *= 1.0 - abs( normal.y ) * 0.85;\n" +   // flacher Boden bleibt unbeleuchtet
      "reflectedLight.indirectDiffuse += terraRim * 0.3 * uRim;");
    patchInfo.rim++;
  }

  // (3) Höhennebel: Dunst sammelt sich in den Senken
  var fv = "#include <fog_vertex>";
  var fogChunk = THREE.ShaderChunk.fog_fragment;
  var fogKey = "gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );";
  var hoeheOk = false;
  if (shader.vertexShader.indexOf(fv) >= 0 && fogChunk && fogChunk.indexOf(fogKey) >= 0 &&
      shader.fragmentShader.indexOf("#include <fog_fragment>") >= 0) {
    shader.vertexShader = "varying float vTerraY;\n" + shader.vertexShader.replace(fv,
      fv + "\nvec4 terraWP = vec4( transformed, 1.0 );\n" +
      "#ifdef USE_INSTANCING\n  terraWP = instanceMatrix * terraWP;\n#endif\n" +
      "vTerraY = ( modelMatrix * terraWP ).y;");
    // Nicht Nebel aufaddieren, sondern die Dichte erhöhen: nahe Objekte
    // bleiben klar, in die Tiefe hinein wird die Senke deutlich dunstiger.
    var fogNeu = fogChunk.replace(fogKey,
      "float terraDicht = 1.0 + 1.7 * ( 1.0 - smoothstep( 1.0, 14.0, vTerraY ) );\n" +
      "fogFactor = 1.0 - pow( max( 1.0 - fogFactor, 0.0 ), terraDicht );\n" + fogKey);
    shader.fragmentShader = shader.fragmentShader

function genBase(seed) {
  for (var j = 0; j < VW; j++) {
    for (var i = 0; i < VW; i++) {
      var x = i - HALF, z = j - HALF;
      var h = fractal(x * 0.006, z * 0.006, seed) * 26 + fractal(x * 0.03, z * 0.03, seed + 77) * 4 - 6;
      // Rand weich unter den Wasserspiegel ziehen, damit die Karte keine Kante zeigt
      var d = Math.min(i, j, MAP - i, MAP - j);

  }
}

var aoRoh = new Float32Array(VW * VW);

(function () { aoRoh.fill(1); aoFeld.fill(1); })();

function computeAO(i0, i1, j0, j1) {
  i0 = clamp(i0 - 1, 0, VW - 1); i1 = clamp(i1 + 1, 0, VW - 1);
  j0 = clamp(j0 - 1, 0, VW - 1); j1 = clamp(j1 + 1, 0, VW - 1);
  var i, j;
  for (j = j0; j <= j1; j++) {
    var jm = (j > 0 ? j - 1 : 0) * VW, jp = (j < VW - 1 ? j + 1 : VW - 1) * VW, jr = j * VW;
    for (i = i0; i <= i1; i++) {
      var im = i > 0 ? i - 1 : 0, ip = i < VW - 1 ? i + 1 : VW - 1;
      var mittel = (hgt[jr + im] + hgt[jr + ip] + hgt[jm + i] + hgt[jp + i] +
                    hgt[jm + im] + hgt[jm + ip] + hgt[jp + im] + hgt[jp + ip]) * 0.125;
      var d = hgt[jr + i] - mittel;                       // >0 = Grat, <0 = Mulde
      aoRoh[jr + i] = clamp(0.95 + d * 2.2, 0.72, 1.04);
    }
  }
  for (j = j0 + 1; j <= j1 - 1; j++) {

        aoRoh[jr2 - VW + i] + aoRoh[jr2 + VW + i]) * 0.125;
    }
  }
  for (j = j0; j <= j1; j++) {                            // Ränder ohne Glättung
    for (i = i0; i <= i1; i++) {
      if (i === i0 || i === i1 || j === j0 || j === j1) aoFeld[j * VW + i] = aoRoh[j * VW + i];
    }
  }
}

/**
 * Einfärbung nach Höhe, Hangneigung und Krümmung. Drei Wiesentöne über
 * zwei Rauschoktaven, Übergänge zu Sand und Fels mit gestörter Grenze —
 * nirgends bleibt eine einfarbige Fläche stehen.
 */
function terrainColor(h, ny, x, z, out, ao) {
  var gross = fractal(x * 0.012, z * 0.012, worldSeed + 404);
  var fein = fractal(x * 0.052, z * 0.052, worldSeed + 505);
  out.copy(C_WIESE_KUEHL).lerp(C_WIESE_WARM,
    clamp(sstep(0.34, 0.72, gross) * 0.8 + sstep(1, 17, h) * 0.35, 0, 1));
  out.lerp(C_WIESE_TROCKEN, sstep(0.54, 0.86, fein) * 0.7);
  out.lerp(C_EARTH, sstep(0.68, 0.9, fractal(x * 0.055, z * 0.055, worldSeed + 717)) * 0.34);

  var stoer = (fractal(x * 0.09, z * 0.09, worldSeed + 606) - 0.5) * 1.7;
  out.lerp(C_SAND, sstep(2.3 + stoer, 0.8 + stoer, h));
  out.lerp(C_ROCK, sstep(12.6 + stoer, 14.1 + stoer, h));
  out.lerp(C_SNOW, sstep(23 + stoer, 25 + stoer, h));
  var rock = 1 - sstep(COS58, COS50, ny);                 // Steilhänge immer Fels
  if (rock > 0) out.lerp(C_ROCK, rock * 0.9);

  if (h < 0.35) {                                          // Meeresgrund
    _tc2.copy(C_SEABED).lerp(C_DEEP, sstep(-0.25, -4.5, h));
    out.lerp(_tc2, sstep(0.35, -0.4, h));
  }
  var surf = sstep(0.8, 0.3, h) * sstep(-0.6, 0.06, h);
  if (surf > 0) out.lerp(C_SURF, surf * 0.5);              // Brandungssaum

  var v = 0.94 + fractal(x * 0.16, z * 0.16, worldSeed + 909) * 0.08
        + vnoise(x * 0.55, z * 0.55, worldSeed + 313) * 0.05;
  out.multiplyScalar(v * (ao === undefined ? 1 : ao));
}

/**
 * Aktualisiert Höhe, Normale und Farbe nur im angegebenen Gitterbereich.
 * Die Upload-Range umfasst ganze Zeilen, damit sie zusammenhängend bleibt.
 */
function refreshGrid(i0, i1, j0, j1) {
  i0 = clamp(i0 | 0, 0, VW - 1); i1 = clamp(i1 | 0, 0, VW - 1);
  j0 = clamp(j0 | 0, 0, VW - 1); j1 = clamp(j1 | 0, 0, VW - 1);
  var pos = terrainGeo.attributes.position, nor = terrainGeo.attributes.normal,
      col = terrainGeo.attributes.color;
  var P = pos.array, N = nor.array, C = col.array;
  for (var j = j0; j <= j1; j++) {
    var jm = (j > 0 ? j - 1 : 0) * VW, jp = (j < VW - 1 ? j + 1 : VW - 1) * VW, jr = j * VW;
    for (var i = i0; i <= i1; i++) {
      var id = jr + i, k = id * 3;
      var h = hgt[id];
      P[k + 1] = h;
      var hl = hgt[jr + (i > 0 ? i - 1 : 0)], hrr = hgt[jr + (i < VW - 1 ? i + 1 : VW - 1)];
      var hd = hgt[jm + i], hu = hgt[jp + i];
      var nx = (hl - hrr) * 0.5, ny = 1, nz = (hd - hu) * 0.5;
      var inv = 1 / Math.sqrt(nx * nx + 1 + nz * nz);
      nx *= inv; ny *= inv; nz *= inv;
      N[k] = nx; N[k + 1] = ny; N[k + 2] = nz;
      terrainColor(h, ny, i - HALF, j - HALF, _tc, aoFeld[id]);
      C[k] = _tc.r; C[k + 1] = _tc.g; C[k + 2] = _tc.b;
    }
  }
  var off = j0 * VW * 3, cnt = (j1 - j0 + 1) * VW * 3;
  pos.updateRange.offset = off; pos.updateRange.count = cnt; pos.needsUpdate = true;
  nor.updateRange.offset = off; nor.updateRange.count = cnt; nor.needsUpdate = true;
  col.updateRange.offset = off; col.updateRange.count = cnt; col.needsUpdate = true;
  if (j0 === 0 && j1 === VW - 1) terrainGeo.computeBoundingSphere();
}

/** Bilineare Höhe an Weltkoordinaten. */
function heightAt(x, z) {
  var fi = clamp(x + HALF, 0, MAP), fj = clamp(z + HALF, 0, MAP);
  var i = Math.min(MAP - 1, fi | 0), j = Math.min(MAP - 1, fj | 0);
  var tx = fi - i, tz = fj - j;
  var a = hgt[j * VW + i], b = hgt[j * VW + i + 1];
  var c = hgt[(j + 1) * VW + i], d = hgt[(j + 1) * VW + i + 1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}
/** y-Komponente der Normalen (= cos der Hangneigung). */
function slopeAt(x, z) {
  var i = clamp(Math.round(x + HALF), 1, VW - 2), j = clamp(Math.round(z + HALF), 1, VW - 2);
  var nx = (hgt[j * VW + i - 1] - hgt[j * VW + i + 1]) * 0.5;
  var nz = (hgt[(j - 1) * VW + i] - hgt[(j + 1) * VW + i]) * 0.5;
  return 1 / Math.sqrt(nx * nx + 1 + nz * nz);
}
/** Interpolierte Terrainnormale — richtet die Kontaktschatten am Hang aus. */
function normalAt(x, z, out) {
  var i = clamp(Math.round(x + HALF), 1, VW - 2), j = clamp(Math.round(z + HALF), 1, VW - 2);
  var nx = (hgt[j * VW + i - 1] - hgt[j * VW + i + 1]) * 0.5;
  var nz = (hgt[(j - 1) * VW + i] - hgt[(j + 1) * VW + i]) * 0.5;
  var inv = 1 / Math.sqrt(nx * nx + 1 + nz * nz);
  out.set(nx * inv, inv, nz * inv);
  return out;
}

function baseHeightAt(x, z) {
  var fi = clamp(x + HALF, 0, MAP), fj = clamp(z + HALF, 0, MAP);
  var i = Math.min(MAP - 1, fi | 0), j = Math.min(MAP - 1, fj | 0);
  var tx = fi - i, tz = fj - j;
  var a = base[j * VW + i], b = base[j * VW + i + 1];
  var c = base[(j + 1) * VW + i], d = base[(j + 1) * VW + i + 1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}

/* --- Korridor-Maske (Straßen, Flüsse, Mauern, Viertel-Gassen) ----------- */
var corridor = new Uint8Array(VW * VW);
function stampCorridor(x, z, r) {
  var a0 = Math.max(0, Math.floor(x + HALF - r)), a1 = Math.min(VW - 1, Math.ceil(x + HALF + r));
  var b0 = Math.max(0, Math.floor(z + HALF - r)), b1 = Math.min(VW - 1, Math.ceil(z + HALF + r));
  var rr2 = r * r;
  for (var j = b0; j <= b1; j++) {
    for (var i = a0; i <= a1; i++) {
      var dx = (i - HALF) - x, dz = (j - HALF) - z;
      if (dx * dx + dz * dz <= rr2) corridor[j * VW + i] = 1;
    }
  }
}
function inCorridor(x, z) {
  var i = Math.round(x + HALF), j = Math.round(z + HALF);
  if (i < 0 || j < 0 || i >= VW || j >= VW) return false;
  return corridor[j * VW + i] === 1;
}

/* --- Flüsse graben ------------------------------------------------------ */
var rivers = [];   // {samples:[{x,z,y}], radius, depth}

/** hgt = base, danach alle Flussstempel — idempotent und bereichsweise anwendbar. */
function recomputeHeights(i0, i1, j0, j1) {
  i0 = clamp(i0 | 0, 0, VW - 1); i1 = clamp(i1 | 0, 0, VW - 1);
  j0 = clamp(j0 | 0, 0, VW - 1); j1 = clamp(j1 | 0, 0, VW - 1);
  for (var j = j0; j <= j1; j++) {
    var row = j * VW;
    for (var i = i0; i <= i1; i++) hgt[row + i] = base[row + i];
  }
  for (var r = 0; r < rivers.length; r++) {
    var riv = rivers[r], R = riv.radius;
    for (var s = 0; s < riv.samples.length; s++) {
      var p = riv.samples[s];
      var a0 = Math.max(i0, Math.floor(p.x + HALF - R)), a1 = Math.min(i1, Math.ceil(p.x + HALF + R));
      var b0 = Math.max(j0, Math.floor(p.z + HALF - R)), b1 = Math.min(j1, Math.ceil(p.z + HALF + R));
      var bed = p.y - riv.depth;
      for (var jj = b0; jj <= b1; jj++) {
        for (var ii = a0; ii <= a1; ii++) {
          var dx = (ii - HALF) - p.x, dz = (jj - HALF) - p.z;
          var d = Math.sqrt(dx * dx + dz * dz);
          if (d > R) continue;
          var w = sstep(R, R * 0.3, d);
          var id = jj * VW + ii;
          var target = lerp(base[id], bed, w);
          if (target < hgt[id]) hgt[id] = target;
        }
      }
    }
  }
}

/* ==========================================================================
   4 — Geometrie-Werkzeuge: Zusammenfügen, Prisma, Röhren, Blattscheiben
   ========================================================================== */

/** Fügt Geometrien (position/normal/color, indiziert oder nicht) zu einer zusammen. */
function mergeGeos(list) {
  var vTot = 0, iTot = 0, g, i, k;
  for (i = 0; i < list.length; i++) {
    g = list[i];
    vTot += g.attributes.position.count;
    iTot += g.index ? g.index.count : g.attributes.position.count;
  }
  var pos = new Float32Array(vTot * 3), nor = new Float32Array(vTot * 3), col = new Float32Array(vTot * 3);
  var idx = vTot > 65535 ? new Uint32Array(iTot) : new Uint16Array(iTot);
  var vo = 0, io = 0;
  for (i = 0; i < list.length; i++) {
    g = list[i];
    var c = g.attributes.position.count;
    pos.set(g.attributes.position.array.subarray(0, c * 3), vo * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array.subarray(0, c * 3), vo * 3);
    if (g.attributes.color) col.set(g.attributes.color.array.subarray(0, c * 3), vo * 3);
    else col.fill(1, vo * 3, (vo + c) * 3);
    if (g.index) {
      var a = g.index.array;
      for (k = 0; k < a.length; k++) idx[io + k] = a[k] + vo;
      io += a.length;
    } else {
      for (k = 0; k < c; k++) idx[io + k] = vo + k;
      io += c;
    }
    vo += c;
  }
  var out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  out.setAttribute("color", new THREE.BufferAttribute(col, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  out.computeBoundingSphere();
  return out;
}

/** Transformationsmatrix aus Position / Euler / Skalierung. */
function M(x, y, z, rx, ry, rz, sx, sy, sz) {
  var m = new THREE.Matrix4();
  m.compose(
    new THREE.Vector3(x || 0, y || 0, z || 0),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0)),
    new THREE.Vector3(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz)
  );
  return m;
}

/** Primitiv einfärben und platzieren. */
function part(geo, mat, hex) {
  var g = geo.clone();
  if (mat) g.applyMatrix4(mat);
  if (!g.attributes.normal) g.computeVertexNormals();
  var n = g.attributes.position.count;
  var c = new THREE.Color(hex);
  var arr = new Float32Array(n * 3);
  for (var i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
  return g;
}

/** Giebeldach als Dreiecksprisma (Firstrichtung = z). */
function prismGeo(w, h, d) {
  var hw = w / 2, hd = d / 2;
  var A = [-hw, 0, -hd], B = [hw, 0, -hd], C = [0, h, -hd];
  var D = [-hw, 0, hd], E = [hw, 0, hd], F = [0, h, hd];
  var tri = [A, C, B, D, E, F, A, D, F, A, F, C, B, C, F, B, F, E, A, B, E, A, E, D];
  var pos = new Float32Array(tri.length * 3);
  for (var i = 0; i < tri.length; i++) {
    pos[i * 3] = tri[i][0]; pos[i * 3 + 1] = tri[i][1]; pos[i * 3 + 2] = tri[i][2];
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

/**
 * Röhre mit veränderlichem Radius entlang einer Punktfolge (Parallel-Transport-
 * Rahmen). radiusAt(t,i) und colorAt(t,i,color) steuern Verjüngung und Färbung.
 */
function tubeGeo(pts, radiusAt, radial, colorAt) {
  var n = pts.length, i, j;
  var tang = [];
  for (i = 0; i < n; i++) {
    var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    var t = new THREE.Vector3().subVectors(b, a);
    if (t.lengthSq() < 1e-9) t.set(0, 1, 0);
    tang.push(t.normalize());
  }
  var nv = new THREE.Vector3(0, 1, 0);
  if (Math.abs(tang[0].dot(nv)) > 0.9) nv.set(1, 0, 0);
  nv.crossVectors(tang[0], nv).normalize();
  var pos = new Float32Array(n * radial * 3), nor = new Float32Array(n * radial * 3),
      col = new Float32Array(n * radial * 3);
  var q = new THREE.Quaternion(), bin = new THREE.Vector3(), d = new THREE.Vector3();
  var c = new THREE.Color(1, 1, 1);
  for (i = 0; i < n; i++) {
    if (i > 0) {
      q.setFromUnitVectors(tang[i - 1], tang[i]);
      nv.applyQuaternion(q);
      nv.addScaledVector(tang[i], -nv.dot(tang[i]));
      if (nv.lengthSq() < 1e-8) { nv.set(0, 1, 0); nv.crossVectors(tang[i], nv); }
      nv.normalize();
    }
    bin.crossVectors(tang[i], nv).normalize();
    var tt = n > 1 ? i / (n - 1) : 0;
    var r = radiusAt(tt, i);
    if (colorAt) colorAt(tt, i, c);
    for (j = 0; j < radial; j++) {
      var ang = j / radial * Math.PI * 2, ca = Math.cos(ang), sa = Math.sin(ang);
      d.set(nv.x * ca + bin.x * sa, nv.y * ca + bin.y * sa, nv.z * ca + bin.z * sa);
      var k = (i * radial + j) * 3;
      pos[k] = pts[i].x + d.x * r; pos[k + 1] = pts[i].y + d.y * r; pos[k + 2] = pts[i].z + d.z * r;
      nor[k] = d.x; nor[k + 1] = d.y; nor[k + 2] = d.z;
      col[k] = c.r; col[k + 1] = c.g; col[k + 2] = c.b;
    }
  }
  var idx = new Uint32Array((n - 1) * radial * 6), o = 0;
  for (i = 0; i < n - 1; i++) {
    for (j = 0; j < radial; j++) {
      var j2 = (j + 1) % radial;
      var a1 = i * radial + j, b1 = i * radial + j2, c1 = (i + 1) * radial + j, d1 = (i + 1) * radial + j2;
      idx[o++] = a1; idx[o++] = b1; idx[o++] = c1;
      idx[o++] = b1; idx[o++] = d1; idx[o++] = c1;
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}

/* --- Blattform: Grundlage für Rankenblätter und Blattplateaus ---------- */

/** Halbe Blattbreite an der Längsposition u (0 = Stiel, 1 = Spitze). */
function leafHalfWidth(u) { return Math.sin(Math.PI * Math.pow(u, 0.72)) * (1 - u * 0.12); }
/** Höhenprofil der Blattfläche: leichte Schale quer, Neigung längs, Mittelrippe. */
function leafSurface(u, v, L, cup) {
  return L * (0.05 * Math.sin(u * Math.PI) - 0.07 * u * u)
       - cup * L * v * v * 0.34
       + L * 0.02 * (1 - Math.min(1, Math.abs(v) * 5));
}

/**
 * Erzeugt ein Blatt: Spitze, Mittelrippe, seitliche Adern, gewellter Rand.
 * thick > 0 schließt es zu einem tragfähigen Plateau mit heller Unterseite.
 */
function leafGeo(L, W, cup, thick, topHex, botHex, veinHex, seed) {
  var NU = 16, NV = 12, i, j;
  var pos = [], col = [], idx = [];
  var ct = new THREE.Color(topHex), cb = new THREE.Color(botHex),
      cv = new THREE.Color(veinHex), tmp = new THREE.Color();
  function surface(down, flip) {
    var start = pos.length / 3;
    for (i = 0; i <= NU; i++) {
      var u = i / NU;
      var hw = leafHalfWidth(u);
      for (j = 0; j <= NV; j++) {
        var v = (j / NV) * 2 - 1;
        var wob = 1 + (hashi(i, j, seed) - 0.5) * 0.14 * u;   // gewellter Rand
        var x = u * L;
        var z = v * hw * W * wob;
        var y = leafSurface(u, v, L, cup) - (down ? thick * (0.55 + 0.45 * (1 - Math.abs(v))) : 0);
        pos.push(x, y, z);
        if (down) {
          tmp.copy(cb).multiplyScalar(0.95 + hashi(i, j, seed + 7) * 0.09);
        } else {
          tmp.copy(ct);
          var rib = 1 - Math.min(1, Math.abs(v) * 9);                 // Mittelrippe
          var lat = 1 - Math.min(1, Math.abs(((u * 4.5 + Math.abs(v) * 1.2) % 1) - 0.5) * 9); // Seitenadern
          tmp.lerp(cv, clamp(rib * 0.75 + lat * 0.35 * u, 0, 0.85));
          tmp.multiplyScalar(0.93 + hashi(i, j, seed + 3) * 0.13);
        }
        col.push(tmp.r, tmp.g, tmp.b);
      }
    }
    for (i = 0; i < NU; i++) {
      for (j = 0; j < NV; j++) {
        var a0 = start + i * (NV + 1) + j, b0 = a0 + 1;
        var c0 = start + (i + 1) * (NV + 1) + j, d0 = c0 + 1;
        if (flip) idx.push(a0, c0, b0, b0, c0, d0);
        else idx.push(a0, b0, c0, b0, d0, c0);
      }
    }
    return start;
  }
  surface(false, false);
  if (thick > 0) {
    var bs = surface(true, true);
    for (i = 0; i < NU; i++) {          // Rand schließen
      for (var side = 0; side < 2; side++) {
        var j2 = side === 0 ? 0 : NV;
        var t0 = i * (NV + 1) + j2, t1 = (i + 1) * (NV + 1) + j2;
        var u0 = bs + t0, u1 = bs + t1;
        if (side === 0) idx.push(t0, u0, t1, t1, u0, u1);
        else idx.push(t0, t1, u0, t1, u1, u0);
      }
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(col), 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Flacher Erdhügel, über den die Wurzeln laufen. */
function moundGeo(r, h, x0, z0, seed) {
  var S = 30, R = 6, pos = [], col = [], idx = [], i, j;
  var tmp = new THREE.Color();
  var h0 = heightAt(x0, z0);
  for (i = 0; i <= R; i++) {
    var q = i / R;
    for (j = 0; j < S; j++) {
      var a = j / S * Math.PI * 2;
      var wob = 1 + (hashi(i, j, seed) - 0.5) * 0.26;
      var x = Math.cos(a) * r * q * wob, z = Math.sin(a) * r * q * wob;
      var wx = x0 + x, wz = z0 + z, wh = heightAt(wx, wz);
      // dem Gelände folgen, in der Mitte aufwölben, am Rand einsinken
      var y = (wh - h0) + h * Math.pow(1 - q * q, 1.4) - 0.35 - q * q * 1.6;
      terrainColor(Math.max(0.8, wh), 0.97, wx, wz, tmp);
      tmp.multiplyScalar(0.97 + hashi(j, i, seed + 5) * 0.1);
      pos.push(x, y, z); col.push(tmp.r, tmp.g, tmp.b);
    }
  }
  for (i = 0; i < R; i++) {
    for (j = 0; j < S; j++) {
      var j3 = (j + 1) % S;
      var a1 = i * S + j, b1 = i * S + j3, c1 = (i + 1) * S + j, d1 = (i + 1) * S + j3;
      idx.push(a1, b1, c1, b1, d1, c1);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(col), 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Schwebender Felsbrocken: unten spitz, oben begrünt. */
function islandGeo(r, seed) {
  var g = new THREE.IcosahedronGeometry(r, 1);
  var p = g.attributes.position, n = p.count;
  var col = new Float32Array(n * 3);
  var cTop = new THREE.Color(0x7ba05e), cRock = new THREE.Color(0xa9a396), tmp = new THREE.Color();
  for (var i = 0; i < n; i++) {
    var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    var u = y / r;
    if (u > 0) y *= 0.34; else { var tap = clamp(1 + u * 0.88, 0.06, 1); x *= tap; z *= tap; y *= 1.75; }
    // Verschiebung über quantisierte Position, damit doppelte Ecken gleich bleiben
    var qx = Math.round(x * 40), qy = Math.round(y * 40), qz = Math.round(z * 40);
    var d = (hashi(qx, qz * 31 + qy, seed) - 0.5) * r * 0.3;
    var d2 = (hashi(qz, qx * 17 + qy, seed + 3) - 0.5) * r * 0.22;
    x += d; z += d2; y += (hashi(qy, qx + qz, seed + 9) - 0.5) * r * 0.12;
    p.setXYZ(i, x, y, z);
    tmp.copy(cRock).lerp(cTop, sstep(-0.02, 0.16, y / r));
    tmp.multiplyScalar(0.93 + hashi(qx, qy, seed + 21) * 0.14);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;

/**
 * Dunkelt die Vertexfarben eines Objekts nach unten ab. Ohne
 * Umgebungsverdeckung kleben Objekte sonst wertgleich auf dem Boden —
 * dieser Verlauf setzt sie ab und bringt Tiefe in die Fläche.
 */
function shadeVertical(geo, strength) {
  geo.computeBoundingBox();
  var y0 = geo.boundingBox.min.y, y1 = geo.boundingBox.max.y;
  if (y1 - y0 < 1e-4) return geo;
  var pos = geo.attributes.position, col = geo.attributes.color;
  for (var i = 0; i < pos.count; i++) {
    var f = lerp(1 - strength, 1, sstep(0, 0.6, (pos.getY(i) - y0) / (y1 - y0)));
    col.setXYZ(i, col.getX(i) * f, col.getY(i) * f, col.getZ(i) * f);
  }
  col.needsUpdate = true;
  return geo;
}

/** Pool = ein InstancedMesh je Objekttyp, wächst bei Bedarf. */
function Pool(name, geo, opts) {
  this.name = name;
  this.geo = geo;
  this.radius = opts.radius;
  this.mat = terraMat({
    vertexColors: true,
    side: opts.dbl ? THREE.DoubleSide : THREE.FrontSide,
    transparent: !!opts.transparent,
    opacity: opts.opacity === undefined ? 1 : opts.opacity,
    map: opts.map || null,
    alphaTest: opts.alphaTest || 0
  });
  tintedMats.push(this.mat);
  this.cap = 0;
  this.mesh = null;
  this.count = 0;
}
Pool.prototype.ensure = function (n) {
  if (n <= this.cap) return;
  var cap = Math.max(256, this.cap * 2, Math.ceil(n * 1.35));
  if (this.mesh) { scene.remove(this.mesh); this.mesh.dispose(); }
  var m = new THREE.InstancedMesh(this.geo, this.mat, cap);
  m.frustumCulled = true;
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3).fill(1), 3);
  m.instanceColor.setUsage(THREE.DynamicDrawUsage);
  m.count = 0;
  scene.add(m);
  this.mesh = m;
  this.cap = cap;
};

var POOLS = {};
/** Hüllkugel über die ganze Karte: Culling verwirft korrekt statt falsch. */
function weiteHuelle(geo) {
  geo.computeBoundingSphere();
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 60, 0), 460);
  return geo;
}
function definePool(name, geo, opts) {
  opts = opts || {};
  shadeVertical(geo, opts.ao === undefined ? 0.3 : opts.ao);
  weiteHuelle(geo);
  POOLS[name] = new Pool(name, geo, opts);
}

definePool("zypresse", geoZypresse(), { radius: 1.2 });
definePool("haus", geoHaus(0x5b7f9a), { radius: 2.6 });
definePool("haus2", geoHaus(0x7ba89b), { radius: 2.6 });
definePool("turm", geoTurm(), { radius: 2.0 });
definePool("mauer", geoMauer(), { radius: 1.2 });
definePool("saeule", geoSaeule(), { radius: 0.9 });
definePool("feldreihe", geoFeldreihe(), { radius: 0.6, ao: 0.15 });
definePool("busch", geoBusch(), { radius: 0.85, dbl: true });
definePool("gras", geoGras(), { radius: 0.3, dbl: true, ao: 0.18,
  map: TEX.grassTuft, alphaTest: 0.42 });
definePool("blume", geoBlume(0xe08a9e), { radius: 0.3, dbl: true, ao: 0.12 });
definePool("blume2", geoBlume(0xe8c766), { radius: 0.3, dbl: true, ao: 0.12 });
definePool("blume3", geoBlume(0xdde2ee), { radius: 0.3, dbl: true, ao: 0.12 });
definePool("industrie", geoIndustrie(), { radius: 3.4 });
definePool("kran", geoKran(), { radius: 2.4 });
