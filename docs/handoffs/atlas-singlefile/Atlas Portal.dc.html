<!--
  UWE Portal — Atlas (read-only). Mountet dieselbe Single-File-Runtime
  (Atlas.dc.html) im mode="view": gleiche Engine, gleiches Rendering,
  aber Sichtbarkeitsfilter aktiv, keine Werkzeuge, kein Schreibzugriff.
  Entspricht Migrations-Phase M2 (Portal read-only) aus dem Migrationsplan.
-->
<div class="portal-scope" style="display:flex; flex-direction:column; height:100vh; width:100%; background:var(--uwe-bg); color:var(--uwe-fg); font-family:var(--mono); overflow:hidden;">
  <header style="flex:none; display:flex; align-items:center; gap:12px; height:54px; padding:0 18px; background:var(--uwe-panel); border-bottom:2px solid var(--uwe-fg);">
    <a href="Atlas Migrationsplan.dc.html" style="color:var(--uwe-accent); text-decoration:none; font-size:13px;">← Wiki</a>
    <span style="width:1px; height:22px; background:var(--uwe-border);"></span>
    <span style="font-size:14px; color:var(--uwe-accent);">◆</span>
    <span style="font-family:var(--serif); font-size:16px;">Westland — Atlas</span>
    <span style="margin-left:auto; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--uwe-fg-muted);">Portal · read-only</span>
  </header>
  <div style="flex:1; min-height:0;">
    <dc-import name="Atlas" mode="view" hint-size="100%,100%"></dc-import>
  </div>
</div>
