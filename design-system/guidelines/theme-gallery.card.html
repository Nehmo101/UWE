<!-- @dsCard group="Colors" viewport="700x260" name="Theme gallery — 9 palettes" subtitle="Parchment OS is default; 8 more ship for moods & campaign worlds" -->
<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .theme { border: 1px solid var(--uwe-border); border-radius: 10px; overflow: hidden; }
  .bar { display: grid; grid-template-columns: repeat(4, 1fr); height: 40px; }
  .label { padding: 6px 9px; font-family: var(--uwe-font-mono); font-size: 11px; }
  .label b { color: var(--uwe-fg); }
  .label span { display:block; color: var(--uwe-fg-muted); font-size: 10px; }
</style>
</head>
<body>
<div class="grid">
  <div class="theme"><div class="bar"><i style="background:#f1e8d4"></i><i style="background:#211d17"></i><i style="background:#c2622b"></i><i style="background:#2f6f63"></i></div><div class="label"><b>Parchment OS</b><span>default · paper + ink</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#0b1220"></i><i style="background:#e2e8f0"></i><i style="background:#6366f1"></i><i style="background:#38bdf8"></i></div><div class="label"><b>UWE Default</b><span>slate + indigo</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#070d18"></i><i style="background:#dbeafe"></i><i style="background:#22d3ee"></i><i style="background:#7dd3fc"></i></div><div class="label"><b>Dark Fantasy</b><span>navy + cyan</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#232830"></i><i style="background:#a8d4e6"></i><i style="background:#d4737e"></i><i style="background:#ddb566"></i></div><div class="label"><b>Charcoal Desk</b><span>charcoal + rose</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#101620"></i><i style="background:#c5d0de"></i><i style="background:#e85d4c"></i><i style="background:#4d9de0"></i></div><div class="label"><b>Night Observatory</b><span>blue-black</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#f3efe6"></i><i style="background:#3d3832"></i><i style="background:#a67c1a"></i><i style="background:#1d6fa8"></i></div><div class="label"><b>Parchment Study</b><span>warm light</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#080a08"></i><i style="background:#2ee86a"></i><i style="background:#1ad4b8"></i><i style="background:#e6b422"></i></div><div class="label"><b>Phosphor Console</b><span>green terminal</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#0f1a14"></i><i style="background:#d8eadf"></i><i style="background:#84cc16"></i><i style="background:#38bdf8"></i></div><div class="label"><b>Terra</b><span>earthy green</span></div></div>
  <div class="theme"><div class="bar"><i style="background:#140808"></i><i style="background:#fecaca"></i><i style="background:#ef4444"></i><i style="background:#fb923c"></i></div><div class="label"><b>Hells</b><span>infernal crimson</span></div></div>
</div>
</body>
</html>
