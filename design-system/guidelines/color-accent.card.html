<!-- @dsCard group="Colors" viewport="700x150" name="Accent — terracotta & teal" subtitle="The two brand hues: accent (rust) + link (teal)" -->
<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border: 1px solid var(--uwe-border); border-radius: 10px; overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; font-family: var(--uwe-font-mono); font-size: 11px; }
  .meta b { display: block; font-weight: 700; color: var(--uwe-fg); }
  .meta span { color: var(--uwe-fg-muted); }
</style>
</head>
<body>
<div class="swatches">
  <div class="sw"><div class="chip" style="background:var(--uwe-accent)"></div><div class="meta"><b>accent</b><span>#c2622b</span></div></div>
  <div class="sw"><div class="chip" style="background:var(--uwe-accent-hover)"></div><div class="meta"><b>accent-hover</b><span>#d47030</span></div></div>
  <div class="sw"><div class="chip" style="background:var(--uwe-link)"></div><div class="meta"><b>link</b><span>#1a5c4f</span></div></div>
  <div class="sw"><div class="chip" style="background:var(--uwe-wiki-link)"></div><div class="meta"><b>wiki-link</b><span>#2f6f63</span></div></div>
</div>
</body>
</html>
