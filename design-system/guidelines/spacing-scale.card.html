<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="xs 4 · sm 8 · md 12 · lg 16 · xl 24 · 2xl 32" -->
<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; font-family: var(--uwe-font-mono); font-size: 10.5px; color: var(--uwe-fg-muted); }
  .box { background: var(--uwe-accent); border-radius: 3px; margin: 0 auto 6px; }
  .item b { color: var(--uwe-fg); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-xs);height:var(--uwe-spacing-xs)"></div><b>xs</b> 4</div>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-sm);height:var(--uwe-spacing-sm)"></div><b>sm</b> 8</div>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-md);height:var(--uwe-spacing-md)"></div><b>md</b> 12</div>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-lg);height:var(--uwe-spacing-lg)"></div><b>lg</b> 16</div>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-xl);height:var(--uwe-spacing-xl)"></div><b>xl</b> 24</div>
  <div class="item"><div class="box" style="width:var(--uwe-spacing-2xl);height:var(--uwe-spacing-2xl)"></div><b>2xl</b> 32</div>
</body>
</html>
