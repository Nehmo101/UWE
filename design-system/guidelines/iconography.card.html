<!-- @dsCard group="Brand" viewport="700x180" name="Iconography — Lucide" subtitle="lucide-react, 16px, stroke-width 2 — resolved by kebab name" -->
<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; }
  .set { display: flex; flex-wrap: wrap; gap: 22px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--uwe-fg); }
  .ic i { width: 26px; height: 26px; display: inline-flex; }
  .ic span { font-family: var(--uwe-font-mono); font-size: 10px; color: var(--uwe-fg-subtle); }
  [data-lucide] { stroke: var(--uwe-fg); }
</style>
</head>
<body>
<div class="set">
  <div class="ic"><i data-lucide="home"></i><span>home</span></div>
  <div class="ic"><i data-lucide="users"></i><span>users</span></div>
  <div class="ic"><i data-lucide="map-pin"></i><span>map-pin</span></div>
  <div class="ic"><i data-lucide="scroll-text"></i><span>scroll-text</span></div>
  <div class="ic"><i data-lucide="calendar"></i><span>calendar</span></div>
  <div class="ic"><i data-lucide="swords"></i><span>swords</span></div>
  <div class="ic"><i data-lucide="dice-6"></i><span>dice-6</span></div>
  <div class="ic"><i data-lucide="eye-off"></i><span>eye-off</span></div>
  <div class="ic"><i data-lucide="cpu"></i><span>cpu</span></div>
  <div class="ic"><i data-lucide="command"></i><span>command</span></div>
  <div class="ic"><i data-lucide="inbox"></i><span>inbox</span></div>
  <div class="ic"><i data-lucide="settings"></i><span>settings</span></div>
</div>
<script>window.lucide && window.lucide.createIcons();</script>
</body>
</html>
