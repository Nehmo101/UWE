<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="From 2xs badge to 3xl hero — mono body, serif headings" -->
<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 5px 0; }
  .tok { font-family: var(--uwe-font-mono); font-size: 10.5px; color: var(--uwe-fg-subtle); width: 130px; flex: none; }
  .samp { color: var(--uwe-fg); font-family: var(--uwe-font-serif); }
</style>
</head>
<body>
  <div class="row"><span class="tok">3xl / 36px hero</span><span class="samp" style="font-size:var(--uwe-text-3xl)">UWE</span></div>
  <div class="row"><span class="tok">2xl / 28px page</span><span class="samp" style="font-size:var(--uwe-text-2xl)">Hafenstadt Validori</span></div>
  <div class="row"><span class="tok">xl / 21.6px section</span><span class="samp" style="font-size:var(--uwe-text-xl)">Offene Plots</span></div>
  <div class="row"><span class="tok">lg / 16.8px card</span><span class="samp" style="font-size:var(--uwe-text-lg)">Nächste Session</span></div>
  <div class="row"><span class="tok">base / 14.4px body</span><span class="samp" style="font-size:var(--uwe-text-base);font-family:var(--uwe-font-mono)">Portal-sichtbarer Inhalt</span></div>
  <div class="row"><span class="tok">xs / 11.5px meta</span><span class="samp" style="font-size:var(--uwe-text-xs);font-family:var(--uwe-font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--uwe-fg-subtle)">Sichtbarkeit</span></div>
</body>
</html>
