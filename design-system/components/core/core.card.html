<!DOCTYPE html>
<html lang="en" data-uwe-theme="uwe-parchment-os">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .grp-label { font-size: var(--uwe-text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--uwe-fg-subtle); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Card, StatCard, Badge, Tag, EmptyState } = window.UWEDesignSystem_f43eab;
  const I = (name, size = 16) => React.createElement("i", { "data-lucide": name, style: { width: size, height: size, display: "inline-flex" } });

  function Demo() {
    return (
      <div>
        <p className="grp-label">Buttons</p>
        <div className="row">
          <Button variant="accent" icon={I("plus")}>Welt anlegen</Button>
          <Button variant="primary">Speichern</Button>
          <Button variant="secondary">Vorschau</Button>
          <Button variant="subtle">Filter</Button>
          <Button variant="ghost" size="sm">Abbrechen</Button>
          <Button variant="danger" size="sm" icon={I("trash-2", 14)}>Löschen</Button>
        </div>

        <p className="grp-label">Badges &amp; Tags</p>
        <div className="row">
          <Badge tone="accent">Veröffentlicht</Badge>
          <Badge tone="warning">Entwurf</Badge>
          <Badge tone="success">Kanon</Badge>
          <Badge tone="danger">Widersprüchlich</Badge>
          <Badge tone="neutral">NPC</Badge>
          <Tag>hafen</Tag><Tag>intrige</Tag><Tag>adel</Tag>
        </div>

        <p className="grp-label">Stat cards</p>
        <div className="grid" style={{ marginBottom: 18 }}>
          <StatCard value={128} label="Seiten" hint="+6 diese Woche" />
          <StatCard value={14} label="NPCs" />
          <StatCard value="Fr 19:00" label="Nächste Session" hint="in 3 Tagen" />
        </div>

        <div className="grid">
          <Card title="Hafenstadt Validori" style={{ gridColumn: "span 1" }}>
            <p style={{ margin: 0, color: "var(--uwe-fg-muted)", fontSize: "var(--uwe-text-sm)", lineHeight: 1.55 }}>
              Handelsknoten am Südmeer. Drei Fraktionen ringen um die Docks.
            </p>
          </Card>
          <div style={{ gridColumn: "span 2" }}>
            <EmptyState title="Keine offenen Funde" description="Der World Inspector hat keine Sichtbarkeits-Probleme gefunden." />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  if (window.lucide) window.lucide.createIcons();
</script>
</body>
</html>
