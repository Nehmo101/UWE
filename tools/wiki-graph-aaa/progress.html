<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wiki-Graph AAA Progress</title>
    <style>
      :root {
        --ink: #1c1814;
        --paper: #f4ecda;
        --panel: #ebe1cb;
        --line: rgba(28, 24, 20, 0.14);
        --accent: #c2622b;
        --pass: #2f7d6e;
        --fail: #b8462c;
        --wait: #7a7060;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 20% -10%, rgba(194, 98, 43, 0.12), transparent 60%),
          linear-gradient(180deg, #f7f0e2, var(--paper));
        min-height: 100vh;
      }
      header {
        padding: 28px 32px 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(244, 236, 218, 0.85);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      h1 { margin: 0 0 6px; font-size: 1.55rem; letter-spacing: -0.02em; }
      .meta { color: var(--wait); font-size: 0.92rem; }
      .verdict {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel);
        font-weight: 600;
      }
      .verdict.pass { color: var(--pass); }
      .verdict.fail { color: var(--fail); }
      main { padding: 20px 32px 48px; display: grid; gap: 18px; }
      .piece {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 250, 240, 0.72);
        overflow: hidden;
      }
      .piece header {
        position: static;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        padding: 14px 16px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
      }
      .piece h2 { margin: 0; font-size: 1.05rem; }
      .status {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--wait);
      }
      .status.pass { color: var(--pass); }
      .status.fail { color: var(--fail); }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 12px;
      }
      figure {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffdf7;
        overflow: hidden;
        min-height: 180px;
      }
      figure img {
        display: block;
        width: 100%;
        height: 180px;
        object-fit: cover;
        background:
          repeating-linear-gradient(
            -45deg,
            #efe6d2,
            #efe6d2 8px,
            #f7f0e2 8px,
            #f7f0e2 16px
          );
      }
      figcaption {
        padding: 8px 10px;
        font-size: 0.78rem;
        color: var(--wait);
        border-top: 1px solid var(--line);
      }
      .notes { padding: 0 16px 14px; font-size: 0.92rem; line-height: 1.45; }
      .score {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .history {
        margin-top: 8px;
        padding: 12px 16px;
        border-top: 1px dashed var(--line);
        font-size: 0.85rem;
        color: var(--wait);
      }
      @media (max-width: 980px) {
        .grid { grid-template-columns: 1fr; }
        main, header { padding-left: 16px; padding-right: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wiki-Graph AAA Progress</h1>
      <div class="meta">
        Live dashboard · before / after / Obsidian reference · harsh critic loop
      </div>
      <div id="overall" class="verdict">Loading…</div>
    </header>
    <main id="pieces"></main>
    <script>
      async function load() {
        const res = await fetch("./progress.json?ts=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const overall = document.getElementById("overall");
        const blind = data.blindVerdict;
        overall.className = "verdict " + (blind === "uwe" ? "pass" : blind === "obsidian" ? "fail" : "");
        overall.textContent = blind
          ? "Blind verdict: " + (blind === "uwe" ? "UWE wins" : "Obsidian still ahead")
          : "Blind verdict: pending · overall " + data.overall;
        const root = document.getElementById("pieces");
        root.innerHTML = "";
        for (const piece of data.pieces) {
          const el = document.createElement("section");
          el.className = "piece";
          const score = piece.criticScore == null ? "—" : piece.criticScore + "/10";
          const statusClass =
            piece.criticVerdict === "pass" ? "pass" : piece.criticVerdict === "fail" ? "fail" : "";
          el.innerHTML = `
            <header>
              <h2>${piece.name}</h2>
              <div class="status ${statusClass}">${piece.status} · ${piece.criticVerdict} · <span class="score">${score}</span></div>
            </header>
            <div class="grid">
              <figure>
                <img src="${piece.beforeShot}?ts=${Date.now()}" alt="before ${piece.id}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{style:'height:180px;display:grid;place-items:center;color:#7a7060',textContent:'no before shot'}))" />
                <figcaption>Original / before</figcaption>
              </figure>
              <figure>
                <img src="${piece.afterShot}?ts=${Date.now()}" alt="after ${piece.id}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{style:'height:180px;display:grid;place-items:center;color:#7a7060',textContent:'no after shot'}))" />
                <figcaption>Latest after</figcaption>
              </figure>
              <figure>
                <img src="${piece.obsidianRef}?ts=${Date.now()}" alt="obsidian ${piece.id}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{style:'height:180px;display:grid;place-items:center;color:#7a7060',textContent:'Obsidian ref pending'}))" />
                <figcaption>Obsidian reference</figcaption>
              </figure>
            </div>
            <div class="notes"><strong>Critic:</strong> ${piece.notes}</div>
          `;
          root.appendChild(el);
        }
        if (data.criticHistory?.length) {
          const hist = document.createElement("section");
          hist.className = "piece";
          hist.innerHTML = `<div class="history"><strong>Critic history</strong><br/>${data.criticHistory
            .map((h) => `${h.at} — ${h.piece}: ${h.verdict} (${h.score}/10) — ${h.summary}`)
            .join("<br/>")}</div>`;
          root.appendChild(hist);
        }
      }
      load();
      setInterval(load, 4000);
    </script>
  </body>
</html>
