name: PR Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # With the default `some` quantifier the bare '**' pattern matches
          # every file, so the negations never take effect and docs-only PRs
          # run the full gate. `every` = non-code files must fail a negation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.cursor/**'

  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is in sync
        run: git diff --exit-code pnpm-lock.yaml

      - name: Lint (fail fast)
        run: pnpm lint

  fast-checks:
    needs: [detect-changes, lint]
    if: always()
    runs-on: ubuntu-latest
    # Warm Turbo cache: ~6–10 min after lint passes. Cold first run can take
    # longer; the Studio production build adds a few minutes on a cold cache.
    timeout-minutes: 35
    env:
      # Default concurrency (10) OOM-kills parallel tsc/test tasks on the
      # 4-vCPU/16-GB runner once the Turbo cache is cold ("Killed" in logs).
      TURBO_CONCURRENCY: 4
    steps:
      - name: Propagate lint failure
        if: needs.lint.result == 'failure'
        run: |
          echo "Lint failed — skipping typecheck/tests to save runner minutes."
          exit 1

      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        with:
          # Needed for turbo --filter="...[origin/main]" in ci:light:pr:gate.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        run: pnpm install --frozen-lockfile

      - name: Get lockfile hash
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        id: lockfile
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-pr-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            turbo-pr-${{ runner.os }}-
            turbo-quality-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Light CI gate (affected packages, no lint)
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        run: pnpm ci:light:pr:gate

      # Save with `always()` so even a red or timed-out gate seeds the cache —
      # otherwise a cold cache times the job out and the cache is never written
      # (post-step of actions/cache is skipped on cancellation), which loops
      # every subsequent run back into the same timeout.
      - name: Save Turbo cache
        if: always() && needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-pr-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}

      # Restore-only: main's quality job saves the shared next-* cache, so PRs
      # without lockfile changes warm-start from main's Studio build cache.
      - name: Restore Next.js build cache
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        uses: actions/cache/restore@v4
        with:
          path: apps/studio/.next/cache
          key: next-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            next-${{ runner.os }}-

      # ci:light:pr:gate does not build — catch Studio production build breaks
      # (e.g. client components importing server-only modules) in the PR gate.
      # db:generate already ran as part of ci:light:pr:gate.
      - name: Studio production build
        if: needs.detect-changes.outputs.code == 'true' && needs.lint.result == 'success'
        run: pnpm --filter @uwe/studio build

      - name: Docs-only PR — skip heavy gate
        if: needs.detect-changes.outputs.code != 'true'
        run: echo "Docs-only changes; fast-checks satisfied without ci:light."
