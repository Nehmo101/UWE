name: PR Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    # Must cover a fully cold Turbo cache (~30 min); warm runs finish far faster.
    timeout-minutes: 40
    env:
      # Default concurrency (10) OOM-kills parallel tsc/test tasks on the
      # 4-vCPU/16-GB runner once the Turbo cache is cold ("Killed" in logs).
      TURBO_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # With the default `some` quantifier the bare '**' pattern matches
          # every file, so the negations never take effect and docs-only PRs
          # run the full gate. `every` = non-code files must fail a negation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.cursor/**'

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.code == 'true'
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is in sync
        if: steps.changes.outputs.code == 'true'
        run: git diff --exit-code pnpm-lock.yaml

      - name: Get lockfile hash
        if: steps.changes.outputs.code == 'true'
        id: lockfile
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}-
            turbo-${{ runner.os }}-
            turbo-quality-${{ runner.os }}-
            turbo-pr-${{ runner.os }}-

      - name: Light CI gate
        if: steps.changes.outputs.code == 'true'
        run: pnpm ci:light

      # Save with `always()` so even a red or timed-out gate seeds the cache —
      # otherwise a cold cache times the job out and the cache is never written
      # (post-step of actions/cache is skipped on cancellation), which loops
      # every subsequent run back into the same timeout.
      - name: Save Turbo cache
        if: always() && steps.changes.outputs.code == 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Docs-only PR — skip heavy gate
        if: steps.changes.outputs.code != 'true'
        run: echo "Docs-only changes; fast-checks satisfied without ci:light."
