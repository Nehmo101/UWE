name: PR Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      studio_build: ${{ steps.scoped_changes.outputs.studio_build }}
      host_deploy: ${{ steps.scoped_changes.outputs.host_deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: changes
        with:
          # With the default `some` quantifier the bare '**' pattern matches
          # every file, so the negations never take effect and docs-only PRs
          # run the full gate. `every` = non-code files must fail a negation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.cursor/**'

      # Scoped filters are alternatives (OR), so keep the default `some`
      # quantifier instead of the docs-only filter's `every` quantifier.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: scoped_changes
        with:
          filters: |
            studio_build:
              - 'apps/studio/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            host_deploy:
              - 'deploy/scripts/**'
              - 'deploy/systemd/**'
              - 'packages/host-monitor/**'
              - 'scripts/uwe-host-*.sh'
              - '.github/workflows/pr-check.yml'

  fedora-host-smoke:
    needs: detect-changes
    if: needs.detect-changes.outputs.host_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:44
    steps:
      - name: Prepare Fedora action container
        run: dnf install -y git tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fedora 44 host setup smoke
        run: bash deploy/scripts/fedora-host-smoke.sh

  fast-checks:
    needs: [detect-changes, fedora-host-smoke]
    if: always()
    runs-on: ubuntu-latest
    # Single job: lint + affected gate + optional Studio build (~6–18 min warm).
    timeout-minutes: 35
    env:
      # Default concurrency (10) OOM-kills parallel tsc/test tasks on the
      # 4-vCPU/16-GB runner once the Turbo cache is cold ("Killed" in logs).
      TURBO_CONCURRENCY: 4
    steps:
      - name: Verify prerequisite jobs
        id: prerequisites
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          FEDORA_HOST_SMOKE_RESULT: ${{ needs.fedora-host-smoke.result }}
        run: |
          if [[ "$DETECT_CHANGES_RESULT" != "success" ]]; then
            echo "detect-changes did not succeed: $DETECT_CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$FEDORA_HOST_SMOKE_RESULT" != "success" && "$FEDORA_HOST_SMOKE_RESULT" != "skipped" ]]; then
            echo "fedora-host-smoke did not succeed: $FEDORA_HOST_SMOKE_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.detect-changes.outputs.code != 'true'

      - name: Docs-only PR — validate documentation
        if: needs.detect-changes.outputs.code != 'true'
        run: node scripts/docs-check.mjs

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.detect-changes.outputs.code == 'true'
        with:
          # Needed for turbo --filter="...[origin/main]" in ci:light:pr:gate.
          fetch-depth: 0

      - name: File size budget (fail fast, no install)
        if: needs.detect-changes.outputs.code == 'true'
        run: node scripts/file-size-budget-check.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: needs.detect-changes.outputs.code == 'true'
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.detect-changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        if: needs.detect-changes.outputs.code == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        if: needs.detect-changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is in sync
        if: needs.detect-changes.outputs.code == 'true'
        run: git diff --exit-code pnpm-lock.yaml

      - name: Lint (fail fast)
        if: needs.detect-changes.outputs.code == 'true'
        run: pnpm lint

      - name: Get lockfile hash
        if: needs.detect-changes.outputs.code == 'true'
        id: lockfile
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        if: needs.detect-changes.outputs.code == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-pr-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            turbo-pr-${{ runner.os }}-
            turbo-quality-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Light CI gate (affected packages, no lint)
        if: needs.detect-changes.outputs.code == 'true'
        run: pnpm ci:light:pr:gate

      # Save with `always()` so even a red or timed-out gate seeds the cache —
      # otherwise a cold cache times the job out and the cache is never written
      # (post-step of actions/cache is skipped on cancellation), which loops
      # every subsequent run back into the same timeout.
      - name: Save Turbo cache
        if: always() && steps.prerequisites.outcome == 'success' && needs.detect-changes.outputs.code == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-pr-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}

      - name: Save pnpm store cache
        if: always() && steps.prerequisites.outcome == 'success' && needs.detect-changes.outputs.code == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Restore-only: main's quality job saves the shared next-* cache, so PRs
      # without lockfile changes warm-start from main's Studio build cache.
      - name: Restore Next.js build cache
        if: needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.studio_build == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/studio/.next/cache
          key: next-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            next-${{ runner.os }}-

      # ci:light:pr:gate does not build — catch Studio production build breaks
      # (e.g. client components importing server-only modules) in the PR gate.
      # Skipped when the diff cannot affect Studio (packages-only docs/tools).
      - name: Studio production build
        if: needs.detect-changes.outputs.code == 'true' && needs.detect-changes.outputs.studio_build == 'true'
        run: pnpm --filter @uwe/studio build
