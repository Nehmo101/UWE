name: Docs Check

# Supplemental docs validation — not a required PR gate.
# PRs already run pnpm docs:check in pr-check.yml (fast-checks).
# This workflow adds broken-link scanning on main doc changes and manual runs.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".cursor/**"
      - "README.md"
      - "AGENTS.md"
      - "scripts/docs-check.mjs"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required documentation exists
        run: node scripts/docs-check.mjs

      - name: Check for broken internal doc links (basic)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r link; do
            target="${link#(}"
            target="${target%)}"
            # Skip external URLs and anchors-only
            if [[ "$target" =~ ^https?:// ]] || [[ "$target" == \#* ]]; then
              continue
            fi
            # Strip anchor
            file="${target%%#*}"
            if [ -n "$file" ] && [ ! -f "$file" ] && [ ! -d "$file" ]; then
              echo "broken link target: $file (from markdown link $link)"
              missing=1
            fi
          done < <(grep -rhoE '\[[^]]+\]\([^)]+\)' docs/ README.md AGENTS.md 2>/dev/null | sed -E 's/.*\(([^)]+)\).*/\1/' | sort -u || true)

          if [ "$missing" -eq 1 ]; then
            echo "::warning::Some internal markdown links may be broken — review output above."
          fi
