name: Cursor Agent Job

# Agents run in the GitHub Cloud (GitHub-hosted runners). This workflow uses
# GitHub-hosted minutes; the PR gate (pr-check.yml / pnpm ci:light) runs after the
# agent opens a PR, and the full gate (pnpm quality) runs on merge to main.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Development prompt for the Cursor agent"
        required: true
        type: string
      title:
        description: "Job title"
        required: true
        type: string
      job_id:
        description: "UWE DevAgentJob ID"
        required: true
        type: string
      branch_name:
        description: "Target branch name"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cursor-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create branch
        run: git checkout -b "${{ github.event.inputs.branch_name }}"

      - name: Run Cursor CLI (if available)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          echo "UWE Agent Job: ${{ github.event.inputs.title }}"
          echo "Job ID: ${{ github.event.inputs.job_id }}"
          if command -v cursor >/dev/null 2>&1; then
            cursor agent --prompt "${{ github.event.inputs.prompt }}" || echo "Cursor CLI failed — manual follow-up required"
          else
            echo "Cursor CLI not installed in CI — create PR manually from branch"
            echo "${{ github.event.inputs.prompt }}" > .cursor-agent-prompt.txt
          fi

      - name: Commit placeholder if changes
        run: |
          git config user.name "UWE Agent"
          git config user.email "agent@uwe.local"
          git add -A
          git diff --staged --quiet || git commit -m "chore(agent): ${{ github.event.inputs.title }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Light CI gate (PR check will enforce on the opened PR)
        run: pnpm ci:light

      - name: Push branch
        run: git push -u origin "${{ github.event.inputs.branch_name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ github.event.inputs.branch_name }}" \
            --title "${{ github.event.inputs.title }}" \
            --body "Automated UWE Agent Job (${{ github.event.inputs.job_id }}). No auto-merge. Full gate runs on merge to main." \
            --draft || echo "PR may already exist"

      - name: Notify UWE completion callback
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_API_TOKEN: ${{ secrets.STUDIO_API_TOKEN }}
          STUDIO_CALLBACK_URL: ${{ secrets.STUDIO_CALLBACK_URL }}
        run: |
          if [ -z "$STUDIO_CALLBACK_URL" ] || [ -z "$STUDIO_API_TOKEN" ]; then
            echo "STUDIO_CALLBACK_URL or STUDIO_API_TOKEN not set — skipping UWE callback"
            exit 0
          fi
          STATUS="completed"
          ERROR_MESSAGE=""
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failed"
            ERROR_MESSAGE="GitHub Actions job status: ${{ job.status }}"
          fi
          PR_URL=""
          if [ "$STATUS" = "completed" ]; then
            PR_URL="$(gh pr view "${{ github.event.inputs.branch_name }}" --json url -q .url 2>/dev/null || true)"
          fi
          PAYLOAD=$(node -e "console.log(JSON.stringify({job_id: process.argv[1], status: process.argv[2], pr_url: process.argv[3] || null, branch_name: process.argv[4], error_message: process.argv[5] || null}))" \
            "${{ github.event.inputs.job_id }}" "$STATUS" "$PR_URL" "${{ github.event.inputs.branch_name }}" "$ERROR_MESSAGE")
          curl -sf -X POST "${STUDIO_CALLBACK_URL%/}/api/agent-jobs/callback" \
            -H "Authorization: Bearer ${STUDIO_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "UWE callback failed (non-fatal)"
