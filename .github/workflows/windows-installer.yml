name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer package
        run: pnpm --filter @uwe/windows-installer run build

      - name: Installer typecheck
        run: pnpm --filter @uwe/windows-installer run typecheck

      - name: Installer unit tests
        run: pnpm --filter @uwe/windows-installer test

      - name: Installer scaffolding tests
        run: node --import tsx --test scripts/windows-installer.test.ts

      - name: Windows installer dry-run
        run: pnpm installer:windows:dry-run

  build-exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer package
        run: pnpm --filter @uwe/windows-installer run build

      - name: Install pkg
        run: pnpm --filter @uwe/windows-installer add -D @yao-pkg/pkg@6.5.1

      - name: Build Windows EXE
        run: pnpm installer:windows:build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: uwe-windows-setup-exe
          path: tools/windows-installer/dist/exe/UWE-Setup.exe
          if-no-files-found: warn
          retention-days: 3
