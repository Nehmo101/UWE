name: UWE Windows Release

# Publishes a GitHub Release with the Windows Command Center installers (NSIS/MSI)
# and a uwe-release.json manifest. Tags use uwe-vX.Y.Z — that tag IS the contract
# with the Command Center: a monorepo checkout syncs to it via git, a bundle
# installation reads uwe-release.json from the release at that tag.
#
# Two ways in, one result:
#   * push a tag `uwe-vX.Y.Z` — the release is built for exactly that commit
#   * run the workflow manually — the tag is created from the checked-out ref
# Either way the version must match the root VERSION file, so tag, manifest,
# installer name and the version the app reports at runtime cannot drift apart.

on:
  push:
    tags:
      - "uwe-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semver without prefix (reads VERSION when empty)
        required: false
        default: ""
      draft:
        description: Create draft release
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Auf Commit-SHA gepinnt — deshalb muss die Toolchain explizit gesetzt
      # werden (die Action liest sie sonst aus dem Git-Ref).
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "apps/engine-connector-client/src-tauri -> target"

      # Auf einem Tag-Push ist der Tag die Quelle der Version; beim manuellen Lauf
      # die VERSION-Datei (bzw. die übereinstimmende Eingabe). In beiden Fällen
      # muss VERSION passen — ein Tag, dessen Version nicht im Commit steht,
      # liefert eine App, die sich selbst falsch benennt, und einen Update-Check,
      # der nie „aktuell" sagt.
      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#uwe-v}"
            if [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "Tag $TAG points at a commit whose VERSION is $FILE_VERSION." >&2
              echo "Bump VERSION to $VERSION (and CHANGELOG) before tagging." >&2
              exit 1
            fi
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "$VERSION" ]]; then
              VERSION="$FILE_VERSION"
            elif [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "Input version ($VERSION) must match VERSION file ($FILE_VERSION). Bump VERSION in a PR first." >&2
              exit 1
            fi
            TAG="uwe-v${VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (sha=$(git rev-parse --short HEAD), trigger=$GITHUB_EVENT_NAME)"

      # Alle fünf Fassungsangaben auf die Release-Version ziehen — dasselbe
      # Skript, das ein Versions-PR benutzt, damit Build und PR nicht zwei
      # Regeln anwenden. Wichtig ist dabei das Rust-Crate: aus
      # `CARGO_PKG_VERSION` meldet das Command Center dem Update-Check, welche
      # Fassung gerade läuft. Bliebe sie stehen, hielte sich eine
      # Bundle-Installation für veraltet und öffnete den Installer erneut.
      - name: Sync package versions for the build
        run: node scripts/set-release-version.mjs "${{ steps.meta.outputs.version }}"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @uwe/database db:generate

      # App-Bundles: `pnpm build` statt `build:release`, denn dessen
      # Standalone-Prüfung ist auf Windows strukturell rot — pnpm verlinkt dort
      # mit Junctions (absolute Ziele in den .cache), auf Linux mit relativen
      # Symlinks. Der Standalone-Baum wird für die Bundles ohnehin nicht
      # verwendet: build-release-bundles.mjs baut die Laufzeit über
      # `pnpm deploy` auf und prüft sie mit eigenen, strengeren Gates
      # (Modul-Auflösung aus zwei Blickwinkeln, next-Versionstreue). Die
      # Standalone-Prüfung für den Linux-Host-Pfad läuft weiter im
      # quality-Job der Linux-CI.
      - name: Build apps
        run: pnpm build

      - name: Pack app bundles and empty databases
        run: node scripts/build-release-bundles.mjs --version "${{ steps.meta.outputs.version }}" --out release-assets

      # Host-Laufzeit für Rechner ohne Node/Git/pnpm: die zu einer Datei
      # gebündelte Desktop-Host-CLI, eine eigenständige node.exe (dieselbe
      # Major-Version wie der Build — die ABI steht im Manifest) und die
      # Prisma-CLI samt Engines für Migrationen bei Updates. Tauri packt das
      # Verzeichnis als Resource neben die EXE (bundle.resources).
      - name: Stage bundled host runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="apps/engine-connector-client/src-tauri/resources/host-runtime"
          rm -f "$RUNTIME/README.txt"
          # Kein "--" vor den Script-Argumenten: pnpm reicht es woertlich weiter.
          pnpm --filter @uwe/host-command-center bundle-cli --out "$RUNTIME/host-cli.cjs"
          NODE_VERSION="$(node -p 'process.version.slice(1)')"
          curl -fsSL -o "$RUNTIME/node.exe" \
            "https://nodejs.org/dist/v${NODE_VERSION}/win-x64/node.exe"
          "$RUNTIME/node.exe" -v
          # Prisma-CLI samt Engines über die echte Modulauflösung finden —
          # Globs in den .pnpm-Store treffen bei mehreren Versionen die falsche.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { createRequire } = require("node:module");
            const rDb = createRequire(path.resolve("packages/database/package.json"));
            const cli = path.dirname(rDb.resolve("prisma/package.json"));
            // @prisma/engines ist eine Dependency der CLI, nicht von
            // @uwe/database — im pnpm-Layout löst es nur von der CLI aus.
            const rCli = createRequire(path.join(cli, "package.json"));
            let engines;
            try {
              engines = path.dirname(rCli.resolve("@prisma/engines/package.json"));
            } catch {
              const haupt = rCli.resolve("@prisma/engines");
              const marker = path.sep + "node_modules" + path.sep + "@prisma" + path.sep + "engines" + path.sep;
              engines = haupt.slice(0, haupt.lastIndexOf(marker) + marker.length - 1);
            }
            const ziel = process.argv[1];
            fs.cpSync(path.join(cli, "build"), path.join(ziel, "prisma", "build"), { recursive: true });
            fs.cpSync(engines, path.join(ziel, "prisma", "node_modules", "@prisma", "engines"), { recursive: true, dereference: true });
            console.log("Prisma-CLI:", cli, "— Engines:", engines);
          ' "$RUNTIME"
          ls -la "$RUNTIME"

      - name: Build Windows Command Center
        # Kein "--" vor den Script-Argumenten: pnpm reicht es woertlich an die
        # Tauri-CLI durch, und dort markiert "--" den Beginn der cargo-Argumente —
        # cargo bricht dann an "--bundles" ab (Run 30890650044).
        run: pnpm --filter @uwe/engine-connector-client tauri:build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect bundle artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="apps/engine-connector-client/src-tauri/target/release/bundle"
          mkdir -p release-assets
          NSIS="$(find "$BUNDLE_ROOT/nsis" -type f \( -name '*.exe' -o -name '*-setup.exe' \) | head -n 1 || true)"
          MSI="$(find "$BUNDLE_ROOT/msi" -type f -name '*.msi' | head -n 1 || true)"
          if [[ -z "$NSIS" && -z "$MSI" ]]; then
            echo "No Windows installer artifacts found under $BUNDLE_ROOT" >&2
            find "$BUNDLE_ROOT" -type f | head -n 50 >&2 || true
            exit 1
          fi
          if [[ -n "$NSIS" ]]; then
            cp "$NSIS" "release-assets/$(basename "$NSIS")"
            echo "nsis=release-assets/$(basename "$NSIS")" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$MSI" ]]; then
            cp "$MSI" "release-assets/$(basename "$MSI")"
            echo "msi=release-assets/$(basename "$MSI")" >> "$GITHUB_OUTPUT"
          fi
          # Prefer a stable installer filename for the Command Center update button.
          VERSION="${{ steps.meta.outputs.version }}"
          STABLE="release-assets/UWE_Command_Center_${VERSION}_x64-setup.exe"
          if [[ -n "$NSIS" ]]; then
            cp "$NSIS" "$STABLE"
            echo "stable_nsis=$STABLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          NSIS_PATH="${{ steps.artifacts.outputs.stable_nsis }}"
          if [[ -z "$NSIS_PATH" ]]; then
            NSIS_PATH="${{ steps.artifacts.outputs.nsis }}"
          fi
          VERSION="${{ steps.meta.outputs.version }}"
          # Alle fünf App-Bundles sind Pflicht: Fehlt eines, bricht das
          # Manifest-Skript ab — besser als ein Release, mit dem der Assistent
          # ein Installationsprofil nicht erfüllen kann.
          APP_ARGS=()
          for app in studio portal brain family landing; do
            APP_ARGS+=(--app "${app}=release-assets/uwe-${app}-${VERSION}.tar.gz")
          done
          node scripts/build-uwe-release-manifest.mjs \
            --version "$VERSION" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --sha "${{ github.sha }}" \
            --nsis "$NSIS_PATH" \
            --msi "${{ steps.artifacts.outputs.msi }}" \
            "${APP_ARGS[@]}" \
            --databases "release-assets/uwe-databases-${VERSION}.tar.gz" \
            --notes "UWE Windows release ${VERSION} — Installer, App-Bundles und vormigrierte Datenbanken." \
            --out release-assets/uwe-release.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: UWE ${{ steps.meta.outputs.version }}
          # Auf einem Tag-Push gibt es keine Eingabe — dann nie ein Draft: nur ein
          # veröffentlichtes Release beantwortet /releases/latest/download/.
          draft: ${{ inputs.draft == true }}
          generate_release_notes: true
          body: |
            ## UWE ${{ steps.meta.outputs.version }} (Windows)

            Dieses Release enthält:
            - **UWE Command Center** Windows-Installer (NSIS/MSI)
            - **App-Bundles** `uwe-<app>-${{ steps.meta.outputs.version }}.tar.gz` — fertig gebaute Oberflächen, die die Installation nach der Profilauswahl nachlädt. Kein Git, kein Node, kein pnpm, kein Build auf dem Zielrechner.
            - **`uwe-databases-${{ steps.meta.outputs.version }}.tar.gz`** — leere, bereits migrierte Datenbanken für den Erststart
            - **`uwe-release.json`** — Manifest (schemaVersion 2) mit SHA-256 je Asset; der Client lädt nur, was hier steht, und verwirft jedes Bundle mit falscher Prüfsumme
            - Git-Tag `${{ steps.meta.outputs.tag }}` für den Entwicklermodus aus einem Checkout

            ### Installation
            1. `UWE_Command_Center_${{ steps.meta.outputs.version }}_x64-setup.exe` laden und ausführen
            2. Im Einrichtungs-Assistenten das Profil wählen — geladen werden nur die dazugehörigen Bundles

            ### Update
            Im Command Center **Nach Updates suchen** → **Update installieren**. Nachgeladen werden nur Bundles mit geänderter Prüfsumme; vor Migrationen wird eine Kopie der Datenbanken abgelegt.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
