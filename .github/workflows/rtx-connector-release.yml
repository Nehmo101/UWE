# Multi-platform bundle artifacts for experiments.
# Product Windows releases (GitHub Releases + uwe-v* tags) use uwe-windows-release.yml.
name: RTX Connector Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. rtx-connector-v0.1.0)
        required: true
        default: rtx-connector-v0.1.0

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uwe/database db:generate
      - run: pnpm --filter @uwe/rtx-connector-client tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: rtx-connector-linux
          path: apps/rtx-connector-client/src-tauri/target/release/bundle/**

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uwe/database db:generate
      - run: pnpm --filter @uwe/rtx-connector-client tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: rtx-connector-macos
          path: apps/rtx-connector-client/src-tauri/target/release/bundle/**

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @uwe/database db:generate
      - run: pnpm --filter @uwe/rtx-connector-client tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: rtx-connector-windows
          path: apps/rtx-connector-client/src-tauri/target/release/bundle/**

  # After signing is configured: attach artifacts + generated latest.json to the GitHub Release for tag ${{ inputs.tag }}.
