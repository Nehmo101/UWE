name: Deploy

# Triggered automatically after CI passes on main.
# Runs on a SELF-HOSTED runner installed ON the UWE Linux mini (label: uwe-deploy).
# The runner registers itself outbound to GitHub and pulls jobs — there is NO
# inbound SSH from the GitHub cloud into the LAN (that path timed out before and
# contradicts the "outbound only" architecture).
#
# This job only ORCHESTRATES the deploy: it invokes uwe-cd-trigger.sh, which
# writes a host-update request and starts uwe-host-update.service (systemd).
# The actual git pull + rebuild runs in that service, which stops uwe.service
# during the build (Conflicts=uwe.service) — so the apps free their RAM and a
# 4 GB host has enough memory for the build. The runner agent itself is light
# (~150–250 MB idle); it does not run the heavy CI gate (that stays on the
# GitHub-hosted runner in ci.yml).
#
# Runner setup (one-time):
#   GitHub → Settings → Actions → Runners → New self-hosted runner
#   - Install on the UWE host, run as the `uwe` service user (it needs the
#     NOPASSWD sudoers entry from deploy/sudoers/uwe-host-update).
#   - Add the label `uwe-deploy`, install as a service (./svc.sh install).
#   - Set UWE_HOST_UPDATE_ENABLED=true in /etc/uwe/uwe.env.
#   See docs/engineering/self-hosted-ci.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Harte Absicherung für ein oeffentliches Repository: Der Runner steht im
    # privaten Heimnetz. Deployt wird ausschliesslich, wenn der CI-Lauf aus
    # diesem Repository selbst kam (kein Fork), auf dem Standard-Branch lief und
    # das Repo unter dem erwarteten Owner haengt. Ohne diese Bedingungen koennte
    # ein fremder workflow_run-Kontext einen Host-Update ausloesen.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
      && github.repository_owner == 'Nehmo101'
    runs-on: [self-hosted, uwe-deploy]
    # The host-update service builds synchronously (Type=oneshot); give it room
    # on a low-RAM host that may swap during the build.
    timeout-minutes: 60
    steps:
      - name: Ensure host repository tracks main
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/uwe

          fetch_ok=0
          for attempt in 1 2 3; do
            if git fetch origin main; then
              fetch_ok=1
              break
            fi
            echo "git fetch failed (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "$fetch_ok" -ne 1 ]; then
            echo "::error::git fetch origin main failed after 3 attempts"
            exit 128
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Host repo has local changes — stashing before deploy sync."
            git status --short
            git stash push -m "host deploy pre-sync $(date -Iseconds)"
          fi

          if git merge-base --is-ancestor HEAD origin/main; then
            git merge --ff-only origin/main
            exit 0
          fi

          backup_ref="refs/backup/host-main-before-deploy/$(date -u +%Y%m%dT%H%M%SZ)"
          git update-ref "$backup_ref" HEAD
          echo "Host branch diverged; backed up current HEAD to $backup_ref"
          git reset --hard origin/main

      - name: Trigger host update on the UWE mini
        run: /opt/uwe/deploy/scripts/uwe-cd-trigger.sh

      - name: Show host update diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::host-update-state"
          if [ -f /var/lib/uwe/host-update-state.json ]; then
            cat /var/lib/uwe/host-update-state.json
          else
            echo "No host-update-state.json found."
          fi
          echo "::endgroup::"

          echo "::group::host-update-log"
          if [ -f /var/log/uwe/host-update.log ]; then
            tail -n 240 /var/log/uwe/host-update.log
          else
            echo "No host-update.log found."
          fi
          echo "::endgroup::"
