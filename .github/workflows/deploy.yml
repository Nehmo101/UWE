name: Deploy

# Triggered automatically after CI passes on main.
# Runs on a SELF-HOSTED runner installed ON the UWE Linux mini (label: uwe-deploy).
# The runner registers itself outbound to GitHub and pulls jobs — there is NO
# inbound SSH from the GitHub cloud into the LAN (that path timed out before and
# contradicts the "outbound only" architecture).
#
# This job only ORCHESTRATES the deploy: it invokes uwe-cd-trigger.sh, which
# writes a host-update request and starts uwe-host-update.service (systemd).
# The actual git pull + rebuild runs in that service, which stops uwe.service
# during the build (Conflicts=uwe.service) — so the apps free their RAM and a
# 4 GB host has enough memory for the build. The runner agent itself is light
# (~150–250 MB idle); it does not run the heavy CI gate (that stays on the
# GitHub-hosted runner in ci.yml).
#
# Runner setup (one-time):
#   GitHub → Settings → Actions → Runners → New self-hosted runner
#   - Install on the UWE host, run as the `uwe` service user (it needs the
#     NOPASSWD sudoers entry from deploy/sudoers/uwe-host-update).
#   - Add the label `uwe-deploy`, install as a service (./svc.sh install).
#   - Set UWE_HOST_UPDATE_ENABLED=true in /etc/uwe/uwe.env.
#   See docs/engineering/self-hosted-ci.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, uwe-deploy]
    # The host-update service builds synchronously (Type=oneshot); give it room
    # on a low-RAM host that may swap during the build.
    timeout-minutes: 60
    steps:
      - name: Trigger host update on the UWE mini
        run: /opt/uwe/deploy/scripts/uwe-cd-trigger.sh
