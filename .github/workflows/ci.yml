name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded main pushes to avoid duplicate full-gate runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full quality gate
        run: pnpm quality

      - name: Shellcheck host setup scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning deploy/scripts/setup-uwe-host.sh deploy/scripts/uwe-host-setup.sh deploy/scripts/start-uwe.sh

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Measure runtime budgets (LCP / Web Vitals)
        run: pnpm test:e2e:perf
        env:
          CI: true

      - name: Enforce runtime budgets
        run: node scripts/perf-budget-check.mjs --require

  postgres-smoke:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uwe
          POSTGRES_PASSWORD: uwe
          POSTGRES_DB: uwe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uwe -d uwe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy PostgreSQL migrations
        run: pnpm --filter @uwe/database db:deploy:postgres
        env:
          DATABASE_URL: postgresql://uwe:uwe@localhost:5432/uwe

      - name: PostgreSQL smoke test
        run: pnpm test:postgres-smoke
        env:
          POSTGRES_TEST_URL: postgresql://uwe:uwe@localhost:5432/uwe
          SESSION_SECRET: pg-smoke-test-secret-xxxxxxxxxxxx

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Docker-affecting changes
        id: docker_changes
        shell: bash
        run: |
          base="${{ github.event.before }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          while IFS= read -r file; do
            case "$file" in
              Dockerfile|docker-compose.yml|.dockerignore|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|turbo.json|scripts/docker-*|packages/database/prisma/*)
                changed=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.docker_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker build (studio)
        if: steps.docker_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: studio
          push: false
          cache-from: type=gha,scope=uwe-docker-studio
          cache-to: type=gha,mode=min,scope=uwe-docker-studio

      - name: Docker build (portal)
        if: steps.docker_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: portal
          push: false
          cache-from: type=gha,scope=uwe-docker-portal
          cache-to: type=gha,mode=min,scope=uwe-docker-portal
