name: CI

on:
  push:
    branches: [main]
  schedule:
    # Weekly Sunday 03:00 UTC — runs E2E and performance checks
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded main pushes to avoid duplicate full-gate runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      host_deploy: ${{ steps.filter.outputs.host_deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            db:
              - 'packages/database/**'
              - '**/*postgres*'
            host_deploy:
              - 'deploy/scripts/**'
              - 'deploy/systemd/**'
              - 'packages/host-monitor/**'
              - 'scripts/uwe-host-*.sh'
              - '.github/workflows/ci.yml'

  fedora-host-smoke:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.host_deploy == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: fedora:44
    steps:
      - name: Prepare Fedora action container
        run: dnf install -y git tar gzip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fedora 44 host setup smoke
        run: bash deploy/scripts/fedora-host-smoke.sh

  quality:
    runs-on: ubuntu-latest
    # Must cover a fully cold Turbo/Next cache (full gate incl. builds);
    # warm runs finish far faster.
    timeout-minutes: 50
    env:
      # Default concurrency (10) OOM-kills parallel tsc/test tasks on the
      # 4-vCPU/16-GB runner once the Turbo cache is cold ("Killed" in logs).
      TURBO_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: File size budget (fail fast, no install)
        run: node scripts/file-size-budget-check.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get lockfile hash
        id: lockfile
        run: echo "hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1 | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-
            turbo-pr-${{ runner.os }}-
            turbo-${{ runner.os }}-

      - name: Restore Next.js build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/studio/.next/cache
            apps/portal/.next/cache
          key: next-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Full quality gate
        run: pnpm quality

      # Save with `always()` so even a red or timed-out gate seeds the caches —
      # otherwise a cold cache times the job out and no cache is ever written
      # (the actions/cache post step is skipped on cancellation), which loops
      # every subsequent run back into the same timeout.
      - name: Save Turbo cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}

      - name: Save Next.js build cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/studio/.next/cache
            apps/portal/.next/cache
          key: next-${{ runner.os }}-${{ steps.lockfile.outputs.hash }}

      - name: Save pnpm store cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            deploy-scripts:
              - 'deploy/scripts/**'

      - name: Shellcheck host setup scripts
        if: steps.filter.outputs.deploy-scripts == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning deploy/scripts/setup-uwe-host.sh deploy/scripts/fedora-host-smoke.sh deploy/scripts/lib/uwe-host-constants.sh deploy/scripts/lib/uwe-host-platform.sh deploy/scripts/lib/uwe-host-preflight.sh deploy/scripts/lib/uwe-host-deps.sh deploy/scripts/lib/uwe-host-connector-install.sh deploy/scripts/start-uwe.sh

  rust:
    # Der Tauri-Client wurde bisher nur beim Release gebaut. Dadurch konnten sich
    # Formatabweichungen unbemerkt einschleichen — sie fielen erst auf, als
    # jemand `cargo fmt` auf dem ganzen Crate laufen ließ. Prüfen, sobald Rust
    # angefasst wird, ist billiger als ein roter Release-Build.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'apps/rtx-connector-client/src-tauri/**'
              - '.github/workflows/ci.yml'

      # Auf Commit-SHA gepinnt. Die Action leitet die Toolchain sonst aus dem
      # Git-Ref ab (@stable) — beim SHA-Pin geht das nicht, deshalb der
      # explizite `toolchain`-Input.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.filter.outputs.rust == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.filter.outputs.rust == 'true'
        with:
          workspaces: "apps/rtx-connector-client/src-tauri -> target"

      - name: GTK/WebKit für den Tauri-Build
        if: steps.filter.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: cargo fmt --check
        if: steps.filter.outputs.rust == 'true'
        working-directory: apps/rtx-connector-client/src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        if: steps.filter.outputs.rust == 'true'
        working-directory: apps/rtx-connector-client/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  e2e:
    # Only run on manual trigger or schedule — not on every push to main.
    # Skipped jobs do not fail the workflow, so deploy.yml still triggers.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Measure runtime budgets (LCP / Web Vitals)
        run: pnpm test:e2e:perf
        env:
          CI: true

      - name: Enforce runtime budgets
        run: node scripts/perf-budget-check.mjs --require

      - name: Save Playwright browsers
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  e2e-auth-smoke:
    # Auth regression smoke on every push to main — the full E2E suite
    # stays on schedule/dispatch (see e2e job above).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Auth E2E smoke tests
        run: pnpm test:e2e e2e/studio-auth.spec.ts e2e/portal-auth.spec.ts
        env:
          CI: true

      - name: Save Playwright browsers
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, detect-changes]
    if: >-
      needs.detect-changes.outputs.db == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uwe
          POSTGRES_PASSWORD: uwe
          POSTGRES_DB: uwe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uwe -d uwe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.12.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy PostgreSQL migrations
        run: pnpm --filter @uwe/database db:deploy:postgres
        env:
          DATABASE_URL: postgresql://uwe:uwe@localhost:5432/uwe

      - name: PostgreSQL smoke test
        run: pnpm test:postgres-smoke
        env:
          POSTGRES_TEST_URL: postgresql://uwe:uwe@localhost:5432/uwe
          SESSION_SECRET: pg-smoke-test-secret-xxxxxxxxxxxx
