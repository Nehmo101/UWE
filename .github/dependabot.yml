# Dependabot-Konfiguration.
#
# Gruppierte Updates halten die PR-Zahl klein — ein Monorepo mit ~40 Paketen
# erzeugt sonst zweistellige PR-Wellen pro Woche.
#
# Achtung: CVE-Pins stehen in `pnpm-workspace.yaml` unter `overrides`
# (Begründungen in docs/security/dependency-notes.md). Wenn Dependabot ein
# Paket anhebt, das dort gepinnt ist, muss der Override mitgezogen werden —
# sonst bleibt die alte Version transitiv erzwungen.
version: 2

updates:
  # --- npm / pnpm-Workspace --------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # TypeScript-Major-Bumps: typescript-eslint stützt offiziell nur bis zu
      # einer bestimmten TS-Version (siehe typescript-eslint#10940) — ein
      # TS-6-PR kam schon einmal (#61) und musste revertiert werden, weil das
      # Lint-Gate rot wurde. Erst freigeben, wenn typescript-eslint nachzieht.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint-Major-Bumps: mehrere Plugins (u. a. eslint-config-next) tragen
      # Peer-Deps auf eslint<=9. Ein ESLint-10-PR liefe in dieselbe Wand wie
      # der revertierte #61 — jeden Montag aufs Neue, ohne diesen Block.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # Sicherheitsrelevante Updates einzeln und sofort sichtbar halten.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      typescript-eslint:
        patterns:
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "@eslint/*"
      testing:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "vitest"
          - "@vitest/*"
          - "tsx"
      # Alles Übrige gebündelt — Patch- und Minor-Updates zusammen.
      sonstige-minor-patch:
        update-types:
          - minor
          - patch

  # --- GitHub Actions --------------------------------------------------------
  # Hält die auf Commit-SHA gepinnten Actions aktuell. Ohne diesen Block
  # veralten die Pins still.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # --- Rust / Tauri (Command Center) -----------------------------------------
  - package-ecosystem: cargo
    directory: "/apps/engine-connector-client/src-tauri"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(tauri)"
    groups:
      cargo:
        patterns:
          - "*"
